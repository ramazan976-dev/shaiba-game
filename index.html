<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Шайба</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#8fd8ff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Шайба"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Пингвинёнок Шайба</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;800&display=swap">
<style>
/* Layout: one-screen app, full-bleed scenes (home hill, pitch, rink, kitchen, wardrobe); HUD floats on top. Single bright look on purpose. */
:root{
  --ink:#1d2a44; --sky:#8fd8ff; --sky2:#d6f1ff; --snow:#f7fbff;
  --grass:#3da64a; --grass2:#4bb758; --ice:#eaf6ff; --ice2:#d3ecfb;
  --red:#e2483d; --blue:#2f80ed; --sun:#ffc93c; --beak:#ff9f1c; --pink:#ff6fa8; --tile:#fff1e0; --tile2:#ffe3c4;
  --display:'Rubik', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--sky);color:var(--ink);font-family:var(--display);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{position:relative;height:100%;overflow:hidden}
.screen{position:absolute;inset:0;overflow:hidden}
button{font-family:inherit;border:0;cursor:pointer;color:inherit}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}

/* ---------- penguin ---------- */
.peng{display:block;width:100%;height:auto;overflow:visible}
.peng .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.peng .flipL{transform-box:fill-box;transform-origin:80% 10%}
.peng .flipR{transform-box:fill-box;transform-origin:20% 10%}
.peng .beak-open,.peng .eyes-ouch{display:none}
.peng.idle{animation:breathe 3s ease-in-out infinite}
.peng.happy{animation:hop .45s ease-in-out 2}
.peng.happy .beak-open,.peng.dance .beak-open,.peng.ouch .beak-open{display:inline}
.peng.happy .beak-closed,.peng.dance .beak-closed,.peng.ouch .beak-closed{display:none}
.peng.happy .flipL,.peng.dance .flipL{animation:flapL .22s ease-in-out infinite}
.peng.happy .flipR,.peng.dance .flipR{animation:flapR .22s ease-in-out infinite}
.peng.dance{animation:dance .6s ease-in-out infinite}
.peng.ouch{animation:wobble .35s ease-in-out 4}
.peng.ouch .eyes{display:none}
.peng.ouch .eyes-ouch{display:inline}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025,0.985)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14%)}}
@keyframes flapL{0%,100%{transform:rotate(0)}50%{transform:rotate(35deg)}}
@keyframes flapR{0%,100%{transform:rotate(0)}50%{transform:rotate(-35deg)}}
@keyframes dance{0%,100%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(8deg) translateY(-8%)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg) translateX(-3%)}75%{transform:rotate(7deg) translateX(3%)}}

/* ---------- home ---------- */
#home{background:linear-gradient(var(--sky) 0%, var(--sky2) 58%, var(--snow) 58.2%);display:flex;flex-direction:column;align-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 18px;box-sizing:border-box;gap:8px}
#home::before{content:"";position:absolute;left:-10%;right:-10%;top:52%;height:14%;background:var(--snow);border-radius:50% 50% 0 0;z-index:0}
.cloud{position:absolute;background:#fff;border-radius:40px;opacity:.85;z-index:0}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.c1{width:110px;height:34px;top:9%;left:6%}.c1::before{width:50px;height:50px;top:-24px;left:18px}.c1::after{width:38px;height:38px;top:-16px;left:56px}
.c2{width:80px;height:26px;top:19%;right:7%}.c2::before{width:38px;height:38px;top:-18px;left:12px}.c2::after{width:28px;height:28px;top:-12px;left:42px}
.wordmark{position:relative;z-index:1;font-weight:800;font-size:clamp(26px,8.5vw,54px);padding:0 66px;text-align:center;letter-spacing:.02em;color:#fff;
  text-shadow:0 4px 0 var(--blue),0 7px 0 rgba(29,42,68,.25);margin:4px 0 0;text-wrap:balance}
#homePeng{position:relative;z-index:1;flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;width:100%}
#homePeng .peng{height:100%;max-height:330px;width:auto;max-width:74vw;cursor:pointer}
.micbtn{right:auto;left:max(14px,env(safe-area-inset-left,0px));background:var(--blue)}
.micbtn.on{background:var(--red)}
.micbtn.rec{animation:pulseBtn .35s ease-in-out infinite}
.earwave{position:absolute;z-index:3;top:86px;left:max(14px,env(safe-area-inset-left,0px));width:66px;height:10px;border-radius:5px;background:rgba(255,255,255,.7);overflow:hidden}
.earwave i{display:block;height:100%;width:0;background:var(--red);transition:width .08s}
.singbtn{position:absolute;z-index:3;top:12px;right:max(14px,env(safe-area-inset-right,0px));width:66px;height:66px;border-radius:50%;
  background:var(--pink);display:grid;place-items:center;box-shadow:0 5px 0 rgba(29,42,68,.25)}
.singbtn svg{width:36px;height:36px}
.singbtn.on{animation:pulseBtn .6s ease-in-out infinite}
@keyframes pulseBtn{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.note{position:absolute;z-index:4;font-size:34px;font-weight:800;color:var(--pink);pointer-events:none;animation:floatUp 1.8s ease-out forwards;text-shadow:0 2px 0 #fff}
@keyframes floatUp{from{transform:translateY(0) rotate(-10deg);opacity:1}to{transform:translateY(-160px) rotate(15deg);opacity:0}}
.menu{position:relative;z-index:1;display:grid;grid-template-columns:repeat(5,auto);gap:4px clamp(8px,3vw,26px);justify-content:center}
.d-snake{background:#1f9e8f}

/* food */
.kitchen{background:
  repeating-linear-gradient(0deg,transparent 0 58px,rgba(29,42,68,.06) 58px 60px),
  repeating-linear-gradient(90deg,var(--tile) 0 58px,var(--tile2) 58px 60px)}
#fPeng{flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;width:100%}
#fPeng .peng{height:100%;max-height:300px;width:auto;max-width:64vw}
.table{width:100%;max-width:520px;background:#c88a5a;border-top:10px solid #a8744a;border-radius:18px;padding:14px 10px;box-sizing:border-box;box-shadow:0 6px 0 rgba(29,42,68,.2)}
.foods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;justify-items:center}
.foods .ing{width:100%;max-width:70px}
.ing.wide{background:#fff6d6}
.icebox{display:flex;align-items:center;justify-content:center;gap:14px}
#iceCone{width:clamp(110px,32vw,150px);cursor:pointer}
#iceCone svg{width:100%;height:auto;display:block}
.flavors{display:grid;grid-template-columns:repeat(2,auto);gap:8px}
.flv{width:58px;height:58px;border-radius:50%;border:5px solid #fff;box-shadow:0 4px 0 rgba(29,42,68,.2)}
.closebtn{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 0 rgba(29,42,68,.2)}
.closebtn svg{width:28px;height:28px}
.fly{position:absolute;z-index:40;width:60px;height:60px;pointer-events:none;left:0;top:0}
.fly svg{width:100%;height:100%}

/* snake */
#snake{background:linear-gradient(#bfe9ff,#e3f6ff)}
#snBox{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;touch-action:none}
#snCv{border-radius:16px;box-shadow:0 6px 0 rgba(29,42,68,.2);border:6px solid #fff;touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,72px);grid-template-rows:repeat(2,64px);gap:6px;justify-content:center}
.dp{border-radius:20px;background:#1f9e8f;display:grid;place-items:center;box-shadow:0 5px 0 rgba(29,42,68,.25)}
.dp:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(29,42,68,.25)}
.dp svg{width:40px;height:40px}
.dp.up{grid-column:2;grid-row:1}.dp.left{grid-column:1;grid-row:2}.dp.down{grid-column:2;grid-row:2}.dp.right{grid-column:3;grid-row:2}
.pill{display:flex;align-items:center;gap:6px;background:#fff;padding:5px 14px 5px 8px;border-radius:999px;font-weight:800;font-size:24px;box-shadow:0 3px 0 rgba(29,42,68,.2);font-variant-numeric:tabular-nums}
.pill svg{width:30px;height:30px}
.pill small{font-size:15px;opacity:.6;font-weight:600;display:flex;align-items:center;gap:3px}
.pill small svg{width:18px;height:18px}
.mbtn{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;padding:0}
.mbtn .disc{width:clamp(52px,14.5vw,86px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  box-shadow:0 6px 0 rgba(29,42,68,.25);transition:transform .12s}
.mbtn:active .disc{transform:translateY(4px) scale(.96);box-shadow:0 2px 0 rgba(29,42,68,.25)}
.mbtn .disc svg{width:62%;height:62%}
.mbtn span{font-weight:600;font-size:11.5px;white-space:nowrap}
.menu{grid-template-columns:repeat(6,auto)}
@media (max-width:520px){.menu{grid-template-columns:repeat(3,auto);gap:4px clamp(22px,8vw,40px)}.menu .mbtn .disc{width:clamp(60px,17vw,84px)}.menu .mbtn span{font-size:13px}}
.d-games{background:var(--red)}.d-jump{background:#4fb3e8}.d-learn{background:#ff9f1c}.d-music{background:#2fa84f}
.tappable{touch-action:none}
.peng .eyes-pet{display:none}
.peng.pet .eyes{display:none}
.peng.pet .eyes-pet{display:inline}
.peng.pet{animation:sway 1.2s ease-in-out infinite}
.peng.pet .cheek{opacity:1;fill:#ff6f91}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.heart{position:absolute;z-index:6;pointer-events:none;font-size:30px;color:#ff4f87;animation:floatUp 1.6s ease-out forwards}

/* games hub */
#games{background:linear-gradient(160deg,#8fd8ff,#c7f0d8)}
.hubscroll{position:absolute;inset:0;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:88px 24px;box-sizing:border-box}
.hub{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 12px;max-width:520px;margin:0 auto}
@media (min-width:620px){.hub{grid-template-columns:repeat(4,1fr)}}
.hub .mbtn{background:rgba(255,255,255,.6);border-radius:28px;padding:14px 6px 12px}
.hub .mbtn .disc{width:clamp(80px,24vw,108px)}
.hub .mbtn span{font-size:16px;white-space:normal;text-align:center;line-height:1.15}

/* learn */
#learn{background:linear-gradient(#fff7d6,#ffe9b0)}
.task{display:flex;align-items:center;gap:10px;background:#fff;border-radius:26px;padding:8px 18px;box-shadow:0 5px 0 rgba(29,42,68,.18);min-height:76px}
.task b{font-size:clamp(42px,12vw,60px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.task svg{width:clamp(48px,14vw,64px);height:auto}
.task .spk{width:30px;opacity:.55}
.lfield{flex:1;min-height:0;width:100%;max-width:520px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:clamp(6px,2.5vw,14px)}
.litem{width:clamp(56px,17vw,84px);aspect-ratio:1;background:none;padding:0;transition:transform .15s,opacity .2s}
.litem svg{width:100%;height:100%;display:block}
.litem:active{transform:scale(.9)}
.litem.taken{visibility:hidden}
.litem.no{animation:wobble .3s 2}
.litem.yes{animation:hop .4s 2}
.basket{position:relative;width:min(52vw,220px)}
.basket svg{width:100%;height:auto;display:block}
.basket .cnt{position:absolute;right:-6px;top:-12px;min-width:52px;height:52px;border-radius:26px;background:var(--red);color:#fff;font-weight:800;font-size:30px;display:grid;place-items:center;box-shadow:0 3px 0 rgba(29,42,68,.25);font-variant-numeric:tabular-nums}

/* jump */
#jump{background:#3a8fd6}
#jStage{background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 4px,transparent 4px 26px),linear-gradient(#3a8fd6,#2b74c2)}
.bank{left:0;width:100%;background:linear-gradient(#ffffff,#e6f3ff);box-shadow:0 0 0 4px rgba(255,255,255,.35)}
.floe{border-radius:40% 46% 42% 48% / 50%;background:linear-gradient(#ffffff,#d9eefc);box-shadow:0 6px 0 rgba(10,40,90,.35)}
.jpeng{pointer-events:none;z-index:4}
.jpeng .peng{width:100%}
.splash{position:absolute;border-radius:50%;border:4px solid #fff;pointer-events:none;animation:ring .7s ease-out forwards;z-index:3}
@keyframes ring{from{transform:scale(.2);opacity:1}to{transform:scale(1.6);opacity:0}}
.goalfish{width:54px;height:40px;z-index:2}
.goalfish svg{width:100%;height:100%}
.jtap{left:auto;top:auto;bottom:16px;right:16px;width:70px;height:70px;border-radius:50%;border:6px solid #fff;opacity:.7;pointer-events:none;animation:pulse 1.1s ease-in-out infinite;--p:translate(0,0)}

/* music */
#music{background:linear-gradient(#ffe0f0,#e5dcff)}
#mPeng{flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;width:100%}
#mPeng .peng{height:100%;max-height:230px;width:auto;max-width:56vw}
.inst{width:100%;max-width:560px;display:flex;justify-content:center;align-items:flex-end;gap:6px;touch-action:none;min-height:180px}
.tabs{display:flex;gap:12px}
.tab{width:64px;height:64px;border-radius:20px;background:#fff;display:grid;place-items:center;box-shadow:0 4px 0 rgba(29,42,68,.18);opacity:.55}
.tab.sel{opacity:1;outline:4px solid var(--ink);outline-offset:2px}
.tab svg{width:72%;height:72%}
.key{flex:1;height:180px;border-radius:0 0 14px 14px;border:3px solid var(--ink);border-top:0;position:relative;transition:transform .06s,filter .06s;padding:0;touch-action:none}
.key::after{content:"";position:absolute;left:20%;right:20%;bottom:12px;height:12px;border-radius:6px;background:rgba(255,255,255,.6)}
.key.hit{transform:translateY(4px);filter:brightness(1.15)}
.bar{flex:1;border-radius:12px;border:3px solid rgba(29,42,68,.35);position:relative;padding:0;transition:transform .06s;touch-action:none}
.bar::before,.bar::after{content:"";position:absolute;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:rgba(255,255,255,.8)}
.bar::before{top:8px}.bar::after{bottom:8px}
.bar.hit{transform:scale(.95)}
.drums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;align-items:end;justify-items:center}
.drum{background:none;padding:0;width:100%;touch-action:none;transition:transform .06s}
.drum svg{width:100%;height:auto;display:block}
.drum.hit{transform:scale(.92)}
.d-bath{background:#5ec8e8}.d-doc{background:#fff}.d-mem{background:#9b51e0}.d-color{background:#ff6fa8}

.petb{width:clamp(76px,22vw,96px);aspect-ratio:1;border-radius:24px;background:#fff;padding:6px 10px 0;box-shadow:0 4px 0 rgba(29,42,68,.18);overflow:hidden;box-sizing:border-box}
.petb.sel{outline:5px solid var(--ink);outline-offset:2px}
.d-bowl{background:#e2483d}.d-race{background:#2f80ed}.d-skate{background:#ff9f1c}.d-anim{background:#8fd66b}.d-abc{background:#ff6fa8}
.d-bowl,.d-race,.d-skate{}
/* school */
#school{background:linear-gradient(#bfe9ff,#e9f8ff 62%,#9ed98a 62.2%,#86cc72)}
#schOut,#schIn{position:absolute;inset:0}
#schBuilding{position:absolute;right:6%;bottom:30%;width:min(56vw,280px)}
#schBuilding svg{width:100%;height:auto;display:block}
#schWalker{position:absolute;left:0;bottom:30%;width:min(26vw,120px)}
#schIn{background:linear-gradient(#fff3d9,#ffe8bf 60%,#d9a066 60.2%,#c88a5a);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-block:90px 150px;box-sizing:border-box}
.window2{position:absolute;top:96px;left:8%;width:30%;aspect-ratio:1.2;border:7px solid #fff;border-radius:12px;background:#8fd8ff}
.shelf{position:absolute;top:110px;right:6%;width:40%;height:18%;border-bottom:8px solid #a8744a;display:flex;align-items:flex-end;justify-content:space-around}
.shelf i{display:block;width:18%;border-radius:6px 6px 0 0}
.schRow{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:4%;width:100%;max-width:520px;flex:1;min-height:0}
#schPeng{width:min(38vw,190px)}
#schPeng.lying{transform:rotate(-90deg) translateX(-30%)}
.prop{width:min(40vw,200px);aspect-ratio:1;position:relative}
.prop svg{width:100%;height:100%}
.block{position:absolute;width:28%;aspect-ratio:1;border-radius:6px;border:3px solid rgba(29,42,68,.3);animation:pop .35s}
.mat{position:absolute;left:8%;right:8%;bottom:118px;height:46px;border-radius:24px;background:repeating-linear-gradient(90deg,#9be7c4 0 24px,#c6f3dd 24px 48px);display:none}
#schIn.nap .mat{display:block}
#schIn.nap::after{content:"";position:absolute;inset:0;background:rgba(10,14,50,.45);pointer-events:none}
.schTimer{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:5}
.schTimer .ring{width:100px;height:100px}
.schTimer .ring .in{width:80px;height:80px;background:#fff}
/* hair */
#hairWrap{position:relative;width:min(70vw,300px);touch-action:none}
#hairWrap > div > svg, #hairSvg{display:block;width:100%;height:auto}
#hairSvg{position:absolute;inset:0;height:100%;overflow:visible}
#hairSvg .strand{fill:none;stroke-linecap:round;transition:d .25s}
.fallbit{animation:fallbit 1s ease-in forwards;transform-box:fill-box}
@keyframes fallbit{to{transform:translate(var(--dx),160px) rotate(var(--r));opacity:0}}
#hairSvg.fluff .strand{animation:fluff .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fluff{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.tool.sel{opacity:1;outline:4px solid var(--ink);outline-offset:2px}
.tool.act{opacity:1}
/* bowling */
#bowl{background:#6b4a8f}
#bwStage{background:radial-gradient(circle at 50% 0,#8a66b3,#4a2f6b)}
.lane{border-radius:10px 10px 0 0;background:repeating-linear-gradient(90deg,#e8b26a 0 18px,#deA55c 18px 20px);box-shadow:0 0 0 10px #3a2550}
.pin{z-index:2;transition:opacity .4s}
.pin svg{width:100%;height:100%;display:block}
.bball{z-index:3}
.bball svg{width:100%;height:100%;display:block}
/* race & skate */
#race,#skate{background:#4a5568}
#rcCv,#skCv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#skPlayer{position:absolute;left:0;top:0;pointer-events:none;z-index:2}
#skPlayer svg{display:block;width:100%;height:auto}
/* animals & alphabet */
#animals{background:linear-gradient(#d8f5c8,#b9eaa0)}
#abc{background:linear-gradient(#ffe6f2,#ffd0e6)}
.agrid{flex:1;min-height:0;width:100%;max-width:520px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:center;overflow-y:auto;padding:4px}
.aitem{aspect-ratio:1;border-radius:24px;background:#fff;display:grid;place-items:center;box-shadow:0 4px 0 rgba(29,42,68,.15);font-size:clamp(46px,14vw,72px);line-height:1;padding:0;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.aitem.yes{animation:hop .4s 2;box-shadow:0 0 0 5px #ffd34d}
.aitem.no{animation:wobble .3s 2}
.aitem.bounce{animation:hop .35s 2}
.mtabs{display:flex;gap:12px}
.mtab{min-width:64px;height:58px;border-radius:20px;background:#fff;display:grid;place-items:center;box-shadow:0 4px 0 rgba(29,42,68,.18);opacity:.55;padding:0 12px;font-weight:800;font-size:22px}
.mtab.sel{opacity:1;outline:4px solid var(--ink);outline-offset:2px}
.mtab svg{width:34px;height:34px}
.lettercard{width:min(80vw,340px);aspect-ratio:1;border-radius:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 7px 0 rgba(29,42,68,.2);color:#fff;padding:0}

<script>
const $ = s => document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t, rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>{ const n=a.length; if(n<2) return a[0]; a._r=a._r||[]; const keep=Math.min(n-1,Math.max(1,Math.floor(n/2))); let i,t=0; do{ i=Math.floor(Math.random()*n); }while(a._r.includes(i)&&++t<40); a._r.push(i); while(a._r.length>keep) a._r.shift(); return a[i]; };
const DEFAULT_NAME=['Малыш','Малыш'];
let kid={}; try{ kid=JSON.parse(localStorage.getItem('shaiba-kid')||'{}')||{}; }catch(e){}
const NAME=(kid.name||'').trim()||DEFAULT_NAME[0], NICK=(kid.nick||'').trim()||(kid.name||'').trim()||DEFAULT_NAME[1];

/* ---------- saved look & levels ---------- */
let look={jersey:'#e2483d',hat:'helmet',pet:'peng'}, lv={p:1,h:1};
try{const s=JSON.parse(localStorage.getItem('shaiba-look')||'null'); if(s) look=Object.assign(look,s);}catch(e){}
try{const s=JSON.parse(localStorage.getItem('shaiba-lv')||'null'); if(s) lv=Object.assign(lv,s);}catch(e){}
function saveLook(){try{localStorage.setItem('shaiba-look',JSON.stringify(look))}catch(e){}}
function saveLv(){try{localStorage.setItem('shaiba-lv',JSON.stringify(lv))}catch(e){}}
const MAXLV=5;

/* ---------- art ---------- */
const INK='#1d2a44';
function hatSVG(hat,c){
  if(hat==='helmet') return `<path d="M44 70 Q44 16 100 16 Q156 16 156 70 Z" fill="${c}"/><path d="M100 16 Q104 40 100 70" stroke="#fff" stroke-width="7" fill="none" opacity=".8"/><rect x="40" y="64" width="120" height="10" rx="5" fill="${INK}" opacity=".35"/>`;
  if(hat==='cap') return `<path d="M50 54 Q52 16 100 16 Q148 16 150 54 Z" fill="${c}"/><ellipse cx="150" cy="54" rx="34" ry="8" fill="${c}"/><circle cx="100" cy="17" r="6" fill="#fff"/>`;
  if(hat==='crown') return `<path d="M62 40 L70 2 L86 26 L100 -4 L114 26 L130 2 L138 40 Z" fill="#ffc93c" stroke="#e0a400" stroke-width="3"/><circle cx="100" cy="24" r="5" fill="#e2483d"/>`;
  if(hat==='chef') return `<rect x="66" y="22" width="68" height="20" fill="#fff" stroke="#dde3ea" stroke-width="2"/><circle cx="74" cy="12" r="18" fill="#fff"/><circle cx="100" cy="2" r="20" fill="#fff"/><circle cx="126" cy="12" r="18" fill="#fff"/>`;
  if(hat==='night') return `<path d="M48 60 Q60 4 160 0 Q138 24 154 60 Z" fill="#5b6be0"/><circle cx="160" cy="2" r="11" fill="#fff"/><rect x="42" y="54" width="118" height="13" rx="6" fill="#fff"/>`;
  return '';
}
function penguinOnlySVG(jersey,hat,cls){
  return `<svg class="peng ${cls}" viewBox="0 -14 200 254" aria-hidden="true"><g transform="translate(0,12)">
  <ellipse class="flipL" cx="34" cy="146" rx="14" ry="38" fill="${INK}" transform="rotate(22 34 146)"/>

  <ellipse cx="74" cy="220" rx="22" ry="10" fill="#ff9f1c"/><ellipse cx="126" cy="220" rx="22" ry="10" fill="#ff9f1c"/>
  <ellipse cx="100" cy="148" rx="66" ry="72" fill="${INK}"/>
  <ellipse cx="100" cy="158" rx="46" ry="56" fill="#fff"/>
  <path d="M38 138 Q100 116 162 138 L156 204 Q100 226 44 204 Z" fill="${jersey}"/>

  <text x="100" y="180" text-anchor="middle" font-family="Rubik,Arial,sans-serif" font-weight="800" font-size="36" fill="#fff">1</text>
  <circle cx="100" cy="70" r="52" fill="${INK}"/>
  <circle cx="82" cy="76" r="24" fill="#fff"/><circle cx="118" cy="76" r="24" fill="#fff"/><ellipse cx="100" cy="92" rx="34" ry="20" fill="#fff"/>
  <g class="eyes"><circle cx="86" cy="72" r="9" fill="${INK}"/><circle cx="114" cy="72" r="9" fill="${INK}"/><circle cx="89" cy="69" r="3" fill="#fff"/><circle cx="117" cy="69" r="3" fill="#fff"/></g>
  <g class="eyes-sleep" stroke="${INK}" stroke-width="5" stroke-linecap="round" fill="none"><path d="M78 72 Q86 80 94 72"/><path d="M106 72 Q114 80 122 72"/></g>
  <g class="eyes-pet" stroke="${INK}" stroke-width="5" stroke-linecap="round" fill="none"><path d="M78 76 Q86 66 94 76"/><path d="M106 76 Q114 66 122 76"/></g>
  <g class="eyes-ouch" stroke="${INK}" stroke-width="5" stroke-linecap="round"><path d="M79 66 L93 80 M93 66 L79 80"/><path d="M107 66 L121 80 M121 66 L107 80"/></g>
  <circle class="cheek" cx="68" cy="92" r="7" fill="#ff8fa3" opacity=".75"/><circle class="cheek" cx="132" cy="92" r="7" fill="#ff8fa3" opacity=".75"/>
  <g class="thermo"><rect x="108" y="86" width="46" height="8" rx="4" fill="#fff" stroke="${INK}" stroke-width="2" transform="rotate(-18 108 90)"/><circle cx="152" cy="76" r="6" fill="#e2483d" stroke="${INK}" stroke-width="2"/></g>
  <path class="beak-closed" d="M88 90 Q100 84 112 90 Q100 104 88 90 Z" fill="#ff9f1c"/>
  <g class="beak-open"><path d="M86 88 Q100 82 114 88 L100 94 Z" fill="#ff9f1c"/><path d="M88 94 L112 94 Q100 116 88 94 Z" fill="#ff9f1c"/><path d="M93 96 L107 96 Q100 106 93 96Z" fill="#c2410c"/></g>
  ${hatSVG(hat,jersey)}

}

function spikesPath(cx,cy,r1,r2,n){ let d=''; for(let i=0;i<n*2;i++){ const a=Math.PI*i/n-Math.PI/2, r=i%2?r2:r1; d+=(i?'L':'M')+(cx+Math.cos(a)*r).toFixed(1)+' '+(cy+Math.sin(a)*r).toFixed(1); } return d+'Z'; }
const FACE_PARTS=`
  <g class="eyes"><circle cx="86" cy="72" r="9" fill="${INK}"/><circle cx="114" cy="72" r="9" fill="${INK}"/><circle cx="89" cy="69" r="3" fill="#fff"/><circle cx="117" cy="69" r="3" fill="#fff"/></g>
  <g class="eyes-sleep" stroke="${INK}" stroke-width="5" stroke-linecap="round" fill="none"><path d="M78 72 Q86 80 94 72"/><path d="M106 72 Q114 80 122 72"/></g>
  <g class="eyes-pet" stroke="${INK}" stroke-width="5" stroke-linecap="round" fill="none"><path d="M78 76 Q86 66 94 76"/><path d="M106 76 Q114 66 122 76"/></g>
  <g class="eyes-ouch" stroke="${INK}" stroke-width="5" stroke-linecap="round"><path d="M79 66 L93 80 M93 66 L79 80"/><path d="M107 66 L121 80 M121 66 L107 80"/></g>`;
const THERMO=`<g class="thermo"><rect x="108" y="96" width="46" height="8" rx="4" fill="#fff" stroke="${INK}" stroke-width="2" transform="rotate(-18 108 100)"/><circle cx="152" cy="86" r="6" fill="#e2483d" stroke="${INK}" stroke-width="2"/></g>`;
const JERSEY=c=>`<path d="M38 138 Q100 116 162 138 L156 204 Q100 226 44 204 Z" fill="${c}"/><path d="M42 190 Q100 210 158 190 L157 199 Q100 219 43 199 Z" fill="#fff" opacity=".9"/><text x="100" y="180" text-anchor="middle" font-family="Rubik,Arial,sans-serif" font-weight="800" font-size="36" fill="#fff">1</text>`;

let ac=null;
function audio(){ if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(ac&&ac.state==='suspended') ac.resume(); return ac; }
const live=[];
function tone(f,dur,type='sine',vol=.18,when=0,f2=null,track){
  const a=audio(); if(!a) return; const t=a.currentTime+when;
  const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.02);
  if(track) live.push(o);
}
function sfx(n){
  if(n==='tap') tone(700,.09,'triangle',.15);
  if(n==='giggle') [880,1100,900,1180,950].forEach((f,i)=>tone(f,.08,'triangle',.14,i*.07,f*.85));
  if(n==='ouch') {tone(500,.25,'square',.12,0,250); tone(400,.3,'square',.1,.25,180);}
  if(n==='kick') tone(160,.18,'square',.22,0,45);
  if(n==='slap') {tone(220,.08,'square',.2,0,80); tone(1200,.05,'triangle',.08);}
  if(n==='boing') tone(420,.35,'sine',.22,0,140);
  if(n==='goal') [523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.18,i*.1));
  if(n==='win') [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.25,'triangle',.18,i*.13));
  if(n==='pick') {tone(600,.08,'sine',.15); tone(900,.1,'sine',.15,.07);}
  if(n==='plop') tone(300,.15,'sine',.22,0,700);
  if(n==='stir') tone(rnd(250,350),.12,'triangle',.1,0,rnd(400,500));
  if(n==='chomp') {tone(180,.07,'square',.16,0,90); tone(160,.07,'square',.16,.12,80);}
  if(n==='ding') {tone(1568,.6,'sine',.2); tone(2093,.6,'sine',.12,.05);}
  if(n==='tick') tone(1000,.04,'square',.06);
}

}catch(e){}}

}

/* ---------- song (original tune, ~13 s) ---------- */
let songOn=false, songTimer=null, noteTimer=null;
const mid=m=>440*Math.pow(2,(m-69)/12);
const A=[[72,.5],[76,.5],[79,.5],[76,.5],[77,.5],[81,.5],[79,1],[76,.5],[72,.5],[74,.5],[76,.5],[74,1],[67,1]];
const B=[[72,.5],[76,.5],[79,.5],[84,.5],[83,.5],[79,.5],[81,1],[79,.5],[77,.5],[76,.5],[74,.5],[72,2]];
const MEL=[...A,...B,...A,...B];
const BASS=[48,48,53,53,55,55,48,48];
function playSong(){
  const a=audio(); if(!a) return; const beat=.4; let t=.15;
  MEL.forEach(([m,b])=>{ tone(mid(m),b*beat*.95,'triangle',.16,t,null,true); tone(mid(m+12),b*beat*.5,'sine',.04,t,null,true); t+=b*beat; });
  const beats=Math.round(t/beat);
  for(let i=0;i<beats;i++){
    tone(mid(BASS[Math.floor(i/2)%8]),beat*.9,'sine',.2,.15+i*beat,null,true);
    tone(140,.12,'sine',.18,.15+i*beat,45,true);
    tone(3000,.03,'square',.025,.15+i*beat+beat/2,null,true);
  }
  return t;
}
function spawnNote(){
  const n=document.createElement('span'); n.className='note'; n.textContent=pick(['♪','♫','♬']);
  const r=$('#homePeng').getBoundingClientRect(), ar=$('.app').getBoundingClientRect();
  n.style.left=(r.left-ar.left+r.width*rnd(.2,.8))+'px'; n.style.top=(r.top-ar.top+r.height*rnd(.1,.4))+'px';
  n.style.color=pick(['#ff6fa8','#2f80ed','#e2483d','#9b51e0']);
  $('#home').appendChild(n); setTimeout(()=>n.remove(),1900);
}
function startSong(){
  songOn=true; $('#sing').classList.add('on'); bump('play',10);
  const h=$('#homePeng'); const svg=h.querySelector('svg'); if(svg) svg.setAttribute('class','peng dance');
  say('Ля-ля-ля!');
  const dur=playSong()||13;
  noteTimer=setInterval(spawnNote,450);
  songTimer=setTimeout(()=>{ stopSong(); say(`${NAME}, тебе понравилось?`); },dur*1000+200);
}
function stopSong(){
  if(!songOn) return; songOn=false;
  clearTimeout(songTimer); clearInterval(noteTimer);
  live.splice(0).forEach(o=>{try{o.stop()}catch(e){}});
  $('#sing').classList.remove('on');
  const svg=$('#homePeng svg'); if(svg) svg.setAttribute('class','peng idle');
}
$('#sing').addEventListener('click',()=>{ audio(); micOff(); songOn?stopSong():startSong(); });

/* ---------- REPEAT AFTER ME (needs a microphone; only where the host allows it) ---------- */
const MIC={on:false,stream:null,src:null,proc:null,chunks:[],pre:[],state:'idle',loud:0,quiet:0,recLen:0,mute:0};
const MAX_SEC=7, PRE_SEC=.3, THR=.035, SILENCE_MS=900, PITCH=1.55;
$('#mic').innerHTML=`<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="22" y="6" width="20" height="34" rx="10" fill="#fff"/><path d="M14 30 Q14 48 32 48 Q50 48 50 30" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M32 48 V58 M22 58 H42" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg>`;
$('#earwave').innerHTML='<i></i>';
(async function micProbe(){
  if(!navigator.mediaDevices?.getUserMedia || !(window.AudioContext||window.webkitAudioContext)) return;
  try{ const p=await navigator.permissions?.query({name:'microphone'}); if(p && p.state==='denied') return; }catch(e){}
  $('#mic').hidden=false;
})();
function earPose(on){ const svg=$('#homePeng svg'); if(!svg||songOn) return; svg.setAttribute('class','peng '+(on?'happy':'idle')); }
async function micOn(){
  const a=audio(); if(!a) return;
  try{
    MIC.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  }catch(e){
    $('#mic').hidden=true; say('Ой, я тебя не слышу.'); return;
  }
  MIC.src=a.createMediaStreamSource(MIC.stream);
  MIC.proc=a.createScriptProcessor(2048,1,1);
  const sink=a.createGain(); sink.gain.value=0;
  MIC.src.connect(MIC.proc); MIC.proc.connect(sink); sink.connect(a.destination);
  MIC.proc.onaudioprocess=micFrame;
  Object.assign(MIC,{on:true,state:'listen',chunks:[],pre:[],recLen:0,mute:performance.now()+1200});
  $('#mic').classList.add('on'); $('#earwave').hidden=false;
  say(`${NAME}, скажи что-нибудь!`);
}
function micOff(){
  if(!MIC.on) return;
  MIC.on=false; MIC.state='idle';
  try{MIC.proc.onaudioprocess=null; MIC.proc.disconnect(); MIC.src.disconnect();}catch(e){}
  MIC.stream?.getTracks().forEach(t=>t.stop());
  $('#mic').classList.remove('on','rec'); $('#earwave').hidden=true;
}
function micFrame(e){
  if(!MIC.on) return;
  const d=e.inputBuffer.getChannelData(0), sr=e.inputBuffer.sampleRate;
  let s=0; for(let i=0;i<d.length;i++) s+=d[i]*d[i];
  const rms=Math.sqrt(s/d.length);
  $('#earwave i').style.width=Math.min(100,rms*900)+'%';
  const now=performance.now();
  let talking=false; try{ talking=speechSynthesis.speaking; }catch(_){}
  if(MIC.state==='listen'){
    if(now<MIC.mute || talking || songOn){ MIC.pre=[]; return; }
    MIC.pre.push(new Float32Array(d)); while(MIC.pre.length*d.length>sr*PRE_SEC) MIC.pre.shift();
    if(rms>THR){ MIC.state='rec'; MIC.chunks=[...MIC.pre]; MIC.recLen=0; MIC.quiet=now; $('#mic').classList.add('rec'); earPose(true); }
    return;
  }
  if(MIC.state==='rec'){
    MIC.chunks.push(new Float32Array(d)); MIC.recLen+=d.length/sr;
    if(rms>THR*.6) MIC.quiet=now;
    if(now-MIC.quiet>SILENCE_MS || MIC.recLen>=MAX_SEC){ MIC.state='play'; playBack(sr); }
  }
}
function playBack(sr){
  const a=audio(); $('#mic').classList.remove('rec');
  const len=MIC.chunks.reduce((n,c)=>n+c.length,0);
  if(len<sr*.35){ MIC.state='listen'; earPose(false); return; }   // too short: a cough or a tap
  const buf=a.createBuffer(1,len,sr), ch=buf.getChannelData(0);
  let o=0, peak=0; MIC.chunks.forEach(c=>{ch.set(c,o); o+=c.length;});
  for(let i=0;i<len;i++) peak=Math.max(peak,Math.abs(ch[i]));
  const gainV=Math.min(4,.9/(peak||1));
  const src=a.createBufferSource(); src.buffer=buf; src.playbackRate.value=PITCH;
  const g=a.createGain(); g.gain.value=gainV; src.connect(g).connect(a.destination);
  const svg=$('#homePeng svg'); if(svg) svg.setAttribute('class','peng dance');
  src.onended=()=>{
    if(svg && !songOn) svg.setAttribute('class','peng idle');
    MIC.chunks=[]; MIC.pre=[]; MIC.mute=performance.now()+500;
    if(MIC.on) MIC.state='listen';
    bump('play',2);
  };
  src.start();
}
$('#mic').addEventListener('click',()=>{ audio(); stopSong(); MIC.on?micOff():micOn(); });

function dots(el,n,icon){ el.innerHTML=Array.from({length:5},(_,i)=>`<i class="${i<n?'on':''}">${icon}</i>`).join(''); }

/* ---------- tweens & loop ---------- */
const tweens=[];
function tween(dur,step,done){tweens.push({t:0,dur,step,done});}
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  for(let i=tweens.length-1;i>=0;i--){const tw=tweens[i]; tw.t+=dt; const p=Math.min(1,tw.t/tw.dur); tw.step(p); if(p>=1){tweens.splice(i,1); tw.done&&tw.done();}}
  if(current==='penalty') pTick(dt);
  if(current==='hockey') hTick(dt);
  if(current==='snake') snakeTick(dt);
  if(current==='jump') jTick(dt);
  if(current==='bowl') bwTick(dt);
  if(current==='race') rcTick(dt);
  if(current==='skate') skTick(dt);
  if(current==='school') schTick(dt);
  requestAnimationFrame(loop);
}

}

/* ---------- PENALTY ---------- */
const P={score:0,busy:false,t:0,lastSaved:false,freeze:0,hinted:false};
function pCfg(){ const L=lv.p; return {speed:1+.35*(L-1), hit:.38+.05*(L-1), chance:.45+.1*(L-1), gk:.28+.025*(L-1), goal:1-.05*(L-1)}; }
function layoutP(first){
  const st=$('#pStage'); const W=st.clientWidth, H=st.clientHeight, c=pCfg();
  const gw=Math.min(W*.86,440)*c.goal, gh=Math.min(H*.24,gw*.45), gx=(W-gw)/2, gy=Math.max(H*.15,110);
  Object.assign(P,{W,H,gw,gh,gx,gy});
  Object.assign($('#pGoal').style,{left:gx+'px',top:gy+'px',width:gw+'px',height:gh+'px',boxSizing:'border-box'});
  Object.assign($('#pBox').style,{left:(gx-gw*.12)+'px',top:(gy+gh)+'px',width:(gw*1.24)+'px',height:(gh*.7)+'px',boxSizing:'border-box'});
  P.glw=gw*c.gk; P.glh=P.glw*.79;
  Object.assign($('#pGoalie').style,{width:P.glw+'px',height:P.glh+'px'});
  P.bs=clamp(W*.17,52,76); P.sx=W/2; P.sy=Math.min(H*.76,gy+gh+H*.5);
  Object.assign($('#pBall').style,{width:P.bs+'px',height:P.bs+'px'});
  $('#pSpot').style.transform=`translate(${P.sx-7}px,${P.sy+P.bs*.5}px)`;
  const hint=$('#pHint'); hint.hidden=P.hinted;
  hint.style.setProperty('--p',`translate(${gx+gw/2-45}px,${gy+gh/2-45}px)`);
  if(first){ dots($('#pDots'),P.score,ballSVG); lvlBadge($('#pLvl'),lv.p); }
  if(!P.busy) setBall(P.sx,P.sy,1,0);
}
function setBall(x,y,s,r){ $('#pBall').style.transform=`translate(${x-P.bs/2}px,${y-P.bs/2}px) scale(${s}) rotate(${r}deg)`; }
function pTick(dt){
  if(P.freeze>0) P.freeze-=dt; else P.t+=dt*pCfg().speed;
  const range=P.gw/2-P.glw/2-6;
  P.gk=P.gx+P.gw/2+Math.sin(P.t*1.15)*range;
  $('#pGoalie').style.transform=`translate(${P.gk-P.glw/2}px,${P.gy+P.gh-P.glh+4}px)`;
}
function pShoot(tx,ty){
  if(P.busy) return; P.busy=true;
  if(!P.hinted){P.hinted=true; $('#pHint').hidden=true;}
  tx=clamp(tx,P.gx+P.bs*.45,P.gx+P.gw-P.bs*.45);
  ty=clamp(ty,P.gy+P.bs*.35,P.gy+P.gh-P.bs*.3);
  sfx('kick');
  const fx=P.sx, fy=P.sy, c=pCfg();
  tween(.6,p=>{const e=1-Math.pow(1-p,2); setBall(lerp(fx,tx,e),lerp(fy,ty,e)-Math.sin(Math.PI*p)*P.H*.06,1-.45*e,620*e);},()=>{
    const near=Math.abs(tx-P.gk)<P.glw*c.hit;
    const saved=near && !P.lastSaved && Math.random()<c.chance;
    if(saved){
      P.lastSaved=true; P.freeze=.9; sfx('boing'); say(pick(MISS));
      const g=$('#pGoalie'); g.classList.add('grab'); setTimeout(()=>g.classList.remove('grab'),700);
      const bx=tx+(P.sx-tx)*.35, by=P.sy-P.H*.12;
      tween(.45,p=>setBall(lerp(tx,bx,p),lerp(ty,by,p)-Math.sin(Math.PI*p)*30,lerp(.55,.9,p),620-300*p),()=>setTimeout(resetBall,250));
    } else {
      P.lastSaved=false;
      const goal=$('#pGoal'); goal.classList.remove('shake'); void goal.offsetWidth; goal.classList.add('shake');
      setBall(tx,ty-4,.5,620);
      const done=celebrate('p');
      setTimeout(()=>{ resetBall(); if(done) win('penalty'); },1400);
    }
  });
}
function resetBall(){ setBall(P.sx,P.sy,0,0); tween(.25,p=>setBall(P.sx,P.sy,p,0),()=>{P.busy=false;}); }
$('#pStage').addEventListener('pointerdown',e=>{
  if(e.target.closest('.hud')) return; audio();
  const r=$('#pStage').getBoundingClientRect(); pShoot(e.clientX-r.left,e.clientY-r.top);
});

/* ---------- HOCKEY ---------- */
const Hk={score:0,state:'ready',x:0,y:0,vx:0,vy:0,hinted:false,t:0,freeze:0,lastSaved:false};
function hCfg(){ const L=lv.h; return {goalie:L>=2, speed:[0,.7,1.1,1.5,1.9][L-1], chance:[0,.45,.55,.65,.75][L-1], assist:[1.8,1.6,1.3,1,.8][L-1], goal:1-.06*(L-1)}; }
function layoutH(first){
  const st=$('#hStage'); const W=st.clientWidth, H=st.clientHeight, c=hCfg();
  const gw=clamp(W*.46,150,220)*c.goal, gh=clamp(H*.08,44,60), mouthY=Math.max(H*.2,130), gx=(W-gw)/2, gy=mouthY-gh;
  const r=clamp(W*.075,24,32);
  Object.assign(Hk,{W,H,gw,gh,gx,gy,mouthY,r,sx:W/2,sy:H*.78});
  Object.assign($('#hBoard').style,{width:W+'px',height:mouthY+'px',boxSizing:'border-box'});
  Object.assign($('#hGoal').style,{left:gx+'px',top:(gy+6)+'px',width:gw+'px',height:gh+'px',boxSizing:'border-box'});
  Object.assign($('#hPuck').style,{width:2*r+'px',height:2*r+'px'});
  Hk.gkw=gw*.42; Hk.gkh=Hk.gkw*.79;
  Object.assign($('#hGoalie').style,{width:Hk.gkw+'px',height:Hk.gkh+'px'});
  $('#hGoalie').hidden=!c.goalie;
  $('#hArrow').hidden=Hk.hinted;
  $('#hArrow').style.transform=`translate(${Hk.sx-23}px,${Hk.sy-r-86}px)`;
  if(first){ dots($('#hDots'),Hk.score,puckSVG); lvlBadge($('#hLvl'),lv.h); }
  if(Hk.state==='ready'){Hk.x=Hk.sx;Hk.y=Hk.sy;setPuck(1);}
  hGoalieMove(0);
}
function hGoalieMove(dt){
  const c=hCfg(); if(!c.goalie) return;
  if(Hk.freeze>0) Hk.freeze-=dt; else Hk.t+=dt*c.speed;
  const range=Hk.gw/2-Hk.gkw/2;
  Hk.gk=Hk.gx+Hk.gw/2+Math.sin(Hk.t*1.2)*range;
  $('#hGoalie').style.transform=`translate(${Hk.gk-Hk.gkw/2}px,${Hk.mouthY-Hk.gkh*.55}px)`;
}
function setPuck(s=1){ $('#hPuck').style.transform=`translate(${Hk.x-Hk.r}px,${Hk.y-Hk.r}px) scale(${s})`; }
function hLaunch(vx,vy){
  Hk.vx=vx; Hk.vy=vy; Hk.state='moving'; sfx('slap');
  if(!Hk.hinted){Hk.hinted=true; $('#hArrow').hidden=true;}
}
function hTick(dt){
  hGoalieMove(dt);
  if(Hk.state!=='moving') return;
  const c=hCfg(), gcx=Hk.gx+Hk.gw/2;
  if(Hk.vy<0) Hk.vx+=(gcx-Hk.x)*c.assist*dt;
  Hk.x+=Hk.vx*dt; Hk.y+=Hk.vy*dt;
  const f=Math.pow(.55,dt); Hk.vx*=f; Hk.vy*=f;
  const r=Hk.r;
  if(Hk.x<r){Hk.x=r;Hk.vx=-Hk.vx*.7; sfx('tap');}
  if(Hk.x>Hk.W-r){Hk.x=Hk.W-r;Hk.vx=-Hk.vx*.7; sfx('tap');}
  if(Hk.y>Hk.H-r){Hk.y=Hk.H-r;Hk.vy=-Hk.vy*.6;}
  if(Hk.y-r<=Hk.mouthY){
    if(Hk.x>Hk.gx+r*.4 && Hk.x<Hk.gx+Hk.gw-r*.4){
      if(c.goalie && Math.abs(Hk.x-Hk.gk)<Hk.gkw*.5 && !Hk.lastSaved && Math.random()<c.chance){
        Hk.lastSaved=true; Hk.freeze=.8; Hk.y=Hk.mouthY+r+2; Hk.vy=Math.abs(Hk.vy)*.45+120; Hk.vx*=.5;
        sfx('boing'); say(pick(MISS)); setPuck(); return;
      }
      Hk.lastSaved=false;
      Hk.state='goal'; Hk.y=Hk.gy+Hk.gh*.55; setPuck(.85);
      const g=$('#hGoal'); g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake');
      const done=celebrate('h');
      setTimeout(()=>{ resetPuck(); if(done) win('hockey'); },1400);
      return;
    }
    Hk.y=Hk.mouthY+r; Hk.vy=-Hk.vy*.6; sfx('tap');
  }
  setPuck();
  if(Math.hypot(Hk.vx,Hk.vy)<35){ Hk.state='resting'; setTimeout(resetPuck,450); }
}
function resetPuck(){
  Hk.x=Hk.sx; Hk.y=Hk.sy; Hk.vx=Hk.vy=0; setPuck(0);
  tween(.25,p=>setPuck(p),()=>{Hk.state='ready';});
}
let sw=null;
$('#hStage').addEventListener('pointerdown',e=>{
  if(e.target.closest('.hud')) return; audio();
  const r=$('#hStage').getBoundingClientRect();
  sw={x:e.clientX-r.left,y:e.clientY-r.top,t:performance.now()};
  try{$('#hStage').setPointerCapture(e.pointerId)}catch(_){}
});
$('#hStage').addEventListener('pointerup',e=>{
  if(!sw||Hk.state!=='ready'){sw=null;return;}
  const r=$('#hStage').getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top, dx=x-sw.x, dy=y-sw.y, dt=Math.max(16,performance.now()-sw.t);
  sw=null;
  let vx,vy;
  if(Math.hypot(dx,dy)>30 && dy<-15){
    vx=dx/dt*900; vy=dy/dt*900;
    const m=Math.hypot(vx,vy), mm=clamp(m,650,1700); vx*=mm/m; vy*=mm/m;
  } else {
    let tx=x, ty=y;
    if(ty>Hk.y-40){tx=Hk.gx+Hk.gw/2; ty=Hk.mouthY;}
    const ddx=tx-Hk.x, ddy=ty-Hk.y, m=Math.hypot(ddx,ddy)||1;
    vx=ddx/m*1150; vy=ddy/m*1150;
  }
  hLaunch(vx,vy);
});

function flyTo(svgMarkup,fromEl,done,target='#fPeng'){
  const app=$('.app'), ar=app.getBoundingClientRect(), a=fromEl.getBoundingClientRect(), pr=$(target+' svg').getBoundingClientRect();
  const f=document.createElement('div'); f.className='fly'; f.innerHTML=svgMarkup; app.appendChild(f);
  const x0=a.left-ar.left+a.width/2-30, y0=a.top-ar.top+a.height/2-30;
  const x1=pr.left-ar.left+pr.width/2-30, y1=pr.top-ar.top+pr.height*.33-30;
  tween(.5,p=>{const e=p*p*(3-2*p); f.style.transform=`translate(${lerp(x0,x1,e)}px,${lerp(y0,y1,e)-Math.sin(Math.PI*p)*60}px) scale(${1-.55*p})`;},()=>{f.remove(); done&&done();});
}

/* ---------- SNAKE ---------- */
const SN={cols:11,rows:14,cell:28,body:[],dir:{x:0,y:-1},next:null,apple:null,acc:0,step:.34,started:false,dead:false,score:0,best:0};
try{SN.best=+localStorage.getItem('shaiba-snake-best')||0}catch(e){}
const NUM10=['Один','Два','Три','Четыре','Пять','Шесть','Семь','Восемь','Девять','Десять'];
const arrowBtn=`<svg viewBox="0 0 40 40"><path d="M20 6 L36 28 H4 Z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>`;
document.querySelectorAll('.dp').forEach(b=>{
  const [x,y]=b.dataset.dir.split(',').map(Number);
  const rot=x===1?90:x===-1?-90:y===1?180:0;
  b.innerHTML=arrowBtn.replace('<svg',`<svg style="transform:rotate(${rot}deg)"`);
  b.addEventListener('pointerdown',e=>{e.preventDefault(); audio(); setDir(x,y);});
});
$('#icSnake').innerHTML=`<svg viewBox="0 0 100 100"><path d="M20 80 Q20 60 40 60 Q60 60 60 40 Q60 22 78 22" stroke="#bff0c0" stroke-width="16" fill="none" stroke-linecap="round"/><circle cx="80" cy="22" r="12" fill="#bff0c0"/><circle cx="84" cy="19" r="3" fill="${INK}"/><circle cx="24" cy="86" r="0"/><circle cx="30" cy="84" r="8" fill="#e2483d"/></svg>`;
function snScore(){ $('#snScore').innerHTML=FOOD_ART.apple+`<span>${SN.score}</span><small>${starInk}${SN.best}</small>`; }
function snakeStart(){ snakeLayout(); snakeReset(); setTimeout(()=>{ if(current==='snake') say(`${NAME}, ты змейка! Нажми стрелку и кушай яблочки!`); },300); }
function snakeLayout(){
  const box=$('#snBox'), W=box.clientWidth-12, H=box.clientHeight-12;
  SN.cols=11; SN.cell=Math.max(18,Math.floor(Math.min(W/SN.cols,H/8)));
  SN.rows=clamp(Math.floor(H/SN.cell),8,17);
  const cv=$('#snCv'), dpr=window.devicePixelRatio||1;
  cv.width=SN.cols*SN.cell*dpr; cv.height=SN.rows*SN.cell*dpr;
  cv.style.width=SN.cols*SN.cell+'px'; cv.style.height=SN.rows*SN.cell+'px';
  SN.ctx=cv.getContext('2d'); SN.ctx.setTransform(dpr,0,0,dpr,0,0);
}
function snakeReset(){
  const cx=Math.floor(SN.cols/2), cy=Math.floor(SN.rows/2);
  SN.body=[{x:cx,y:cy},{x:cx,y:cy+1},{x:cx,y:cy+2}];
  Object.assign(SN,{dir:{x:0,y:-1},next:null,acc:0,step:.34,started:false,dead:false,score:0});
  placeApple(); snScore(); snDraw();
}
function placeApple(){
  let p; do{ p={x:Math.floor(Math.random()*SN.cols),y:Math.floor(Math.random()*SN.rows)}; } while(SN.body.some(s=>s.x===p.x&&s.y===p.y));
  SN.apple=p;
}
function setDir(x,y){
  if(SN.dead) return;
  const d=SN.next||SN.dir;
  if(d.x===-x&&d.y===-y) return;
  SN.next={x,y}; sfx('tap');
  if(!SN.started){ SN.started=true; SN.acc=SN.step; }
}
function snakeTick(dt){
  if(!SN.started||SN.dead) return;
  SN.acc+=dt; if(SN.acc<SN.step) return; SN.acc=0;
  if(SN.next){SN.dir=SN.next; SN.next=null;}
  const h=SN.body[0];
  const nh={x:(h.x+SN.dir.x+SN.cols)%SN.cols, y:(h.y+SN.dir.y+SN.rows)%SN.rows};
  const eating=nh.x===SN.apple.x&&nh.y===SN.apple.y;
  const bodyCheck=eating?SN.body:SN.body.slice(0,-1);
  if(bodyCheck.some(s=>s.x===nh.x&&s.y===nh.y)){ snCrash(); return; }
  SN.body.unshift(nh);
  if(eating){
    SN.score++; if(SN.score>SN.best){SN.best=SN.score; try{localStorage.setItem('shaiba-snake-best',SN.best)}catch(e){}}
    sfx('chomp'); setTimeout(()=>sfx('pick'),120); bump('play',5); bump('sleep',-1);
    SN.step=Math.max(.17,SN.step-.012);
    if(SN.score%5===0){ sfx('goal'); confetti(24); say(`${SN.score<=10?NUM10[SN.score-1]+'! ':''}${pick(PRAISE)}`); }
    else say(SN.score<=10?NUM10[SN.score-1]+'!':'Ням!');
    placeApple(); snScore();
  } else SN.body.pop();
  snDraw();
}
function snCrash(){
  SN.dead=true; sfx('ouch'); say(SN.score>0?`Ой! ${NICK}, молодец! Давай ещё разок!`:'Ой! Попробуем ещё!');
  snDraw(true); setTimeout(()=>{ if(current==='snake') snakeReset(); },1800);
}
function snDraw(hurt){
  const c=SN.ctx, s=SN.cell; if(!c) return;
  for(let y=0;y<SN.rows;y++) for(let x=0;x<SN.cols;x++){ c.fillStyle=(x+y)%2?'#a9dc8f':'#b8e6a0'; c.fillRect(x*s,y*s,s,s); }
  // apple
  const ax=SN.apple.x*s+s/2, ay=SN.apple.y*s+s/2;
  c.fillStyle='#e2483d'; c.beginPath(); c.arc(ax,ay+s*.04,s*.36,0,7); c.fill();
  c.fillStyle='#3da64a'; c.beginPath(); c.ellipse(ax+s*.12,ay-s*.32,s*.13,s*.07,-.5,0,7); c.fill();
  c.fillStyle='rgba(255,255,255,.55)'; c.beginPath(); c.arc(ax-s*.12,ay-s*.06,s*.08,0,7); c.fill();
  // body
  c.lineCap='round'; c.lineJoin='round';
  const col=hurt?'#e2876f':'#2fb36b', col2=hurt?'#f4b3a2':'#7ee0a3';
  for(let pass=0;pass<2;pass++){
    c.strokeStyle=pass?col2:col; c.lineWidth=s*(pass?.36:.78);
    c.beginPath();
    SN.body.forEach((p,i)=>{
      const px=p.x*s+s/2, py=p.y*s+s/2;
      if(i===0) c.moveTo(px,py);
      else { const q=SN.body[i-1]; if(Math.abs(q.x-p.x)+Math.abs(q.y-p.y)>1){ c.stroke(); c.beginPath(); c.moveTo(px,py);} else c.lineTo(px,py); }
    });
    if(SN.body.length===1){} c.stroke();
  }
  // head
  const h=SN.body[0], hx=h.x*s+s/2, hy=h.y*s+s/2, d=SN.dir;
  c.fillStyle=col; c.beginPath(); c.arc(hx,hy,s*.48,0,7); c.fill();
  const ex=-d.y, ey=d.x;
  [-1,1].forEach(k=>{
    const x=hx+d.x*s*.12+ex*k*s*.2, y=hy+d.y*s*.12+ey*k*s*.2;
    c.fillStyle='#fff'; c.beginPath(); c.arc(x,y,s*.15,0,7); c.fill();
    c.fillStyle=INK; c.beginPath(); if(hurt){ c.lineWidth=2; c.strokeStyle=INK; c.moveTo(x-s*.08,y-s*.08); c.lineTo(x+s*.08,y+s*.08); c.moveTo(x+s*.08,y-s*.08); c.lineTo(x-s*.08,y+s*.08); c.stroke(); } else { c.arc(x+d.x*s*.04,y+d.y*s*.04,s*.08,0,7); c.fill(); }
  });
  if(!hurt){ c.strokeStyle='#e2483d'; c.lineWidth=2; c.beginPath(); c.moveTo(hx+d.x*s*.45,hy+d.y*s*.45); c.lineTo(hx+d.x*s*.62,hy+d.y*s*.62); c.stroke(); }
  c.fillStyle='rgba(255,143,163,.7)'; [-1,1].forEach(k=>{c.beginPath(); c.arc(hx-d.x*s*.1+ex*k*s*.32,hy-d.y*s*.1+ey*k*s*.32,s*.07,0,7); c.fill();});
}

let snSw=null;
$('#snBox').addEventListener('pointerdown',e=>{snSw={x:e.clientX,y:e.clientY}; audio();});
$('#snBox').addEventListener('pointerup',e=>{

NEED_ICON.sick=`<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="14" width="52" height="42" rx="10" fill="#fff" stroke="#1d2a44" stroke-width="3"/><path d="M24 8 H40 V14 H24Z" fill="#1d2a44"/><path d="M28 22 H36 V31 H45 V39 H36 V48 H28 V39 H19 V31 H28Z" fill="#e2483d"/></svg>`;

const DECAY={food:5,play:7,sleep:3.5,clean:3};   // points per minute
let needs={food:80,play:70,sleep:90,clean:80,sick:false,ts:Date.now()};
try{const s=JSON.parse(localStorage.getItem('shaiba-needs')||'null'); if(s) needs=Object.assign(needs,s);}catch(e){}
(function catchUp(){
  const mins=clamp((Date.now()-needs.ts)/60000,0,240);
  for(const k in DECAY) needs[k]=clamp(needs[k]-DECAY[k]*mins,8,100);
  needs.ts=Date.now();
})();
function saveNeeds(){needs.ts=Date.now(); try{localStorage.setItem('shaiba-needs',JSON.stringify(needs))}catch(e){}}
function bump(k,v){ needs[k]=clamp(needs[k]+v,5,100); saveNeeds(); if(current==='home') renderNeeds(); }
const needColor=v=>v>60?'#3da64a':v>30?'#ffc93c':'#e2483d';
function urgent(){ if(needs.sick) return 'sick'; if(typeof schoolDue==='function' && schoolDue()) return 'school'; let k=null,m=45; for(const n of ['food','play','sleep','clean']) if(needs[n]<m){m=needs[n];k=n;} return k; }
function applySick(){ document.querySelectorAll('#home,#doctor').forEach(el=>el.classList.toggle('is-sick',!!needs.sick)); }
function renderNeeds(){
  applySick();
  $('#needs').innerHTML=['food','play','sleep','clean'].map(k=>{
    const v=Math.round(needs[k]);
    return `<button class="need ${v<=30?'low':''}" data-need="${k}" style="--v:${v};--c:${needColor(v)}" aria-label="${k}"><span class="in">${NEED_ICON[k]}</span></button>`;
  }).join('');
  const u=urgent(), b=$('#bubble');
  b.hidden=!u; if(u){ b.innerHTML=NEED_ICON[u]; b.dataset.need=u; }
}
let lastAsk=0, lastUrgent=null;
function askNeed(force){
  const u=urgent(); const now=Date.now();
  if(!u || songOn){ lastUrgent=u; return; }
  if(force ? now-lastAsk>15000 : (u!==lastUrgent)){
    lastAsk=now; say(u==='school'&&typeof SCHOOL_SAY!=='undefined'&&Math.random()<.6?pick(SCHOOL_SAY):NEED_SAY[u]);
    const svg=$('#homePeng svg'); if(svg && u==='sleep'){ svg.setAttribute('class','peng sleep'); setTimeout(()=>{ if(!songOn) svg.setAttribute('class','peng idle'); },1600); }
  }
  lastUrgent=u;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-need]'); if(!b) return;
  audio(); sfx('tap'); show(NEED_GO[b.dataset.need]);
});
setInterval(()=>{
  if(current==='sleep' && SL.on) return;
  const mins=5/60;
  for(const k in DECAY) needs[k]=clamp(needs[k]-DECAY[k]*mins,8,100);
  saveNeeds();
  if(!needs.sick && (needs.clean<35 || needs.food<25) && Math.random()<.03){ needs.sick=true; saveNeeds(); applySick(); }
  if(document.visibilityState==='visible' && !['school','sleep'].includes(current)) needs.awake=(needs.awake||0)+5;
  if(current==='home'){ renderNeeds(); askNeed(false);
    if(!urgent() && !songOn && !(typeof MIC!=='undefined'&&MIC.on) && Date.now()-lastSay>22000 && Math.random()<.4){ say(pick(chatPool())); const sv=$('#homePeng svg'); if(sv){ sv.setAttribute('class','peng happy'); setTimeout(()=>{ if(!songOn) sv.setAttribute('class','peng idle'); },1000);} }
  } else if(schoolDue() && current!=='school' && current!=='win' && Date.now()-(window._schAsk||0)>90000){ window._schAsk=Date.now(); say(pick(SCHOOL_SAY)); }
},5000);

function lullaby(){
  const notes=[72,76,79,76,74,77,76,72,71,74,72,67];
  let i=0; SL.mus=setInterval(()=>{ tone(mid(notes[i%notes.length]),1.1,'sine',.07); if(i%3===0) tone(mid(notes[i%notes.length]-12),1.4,'sine',.05); i++; },700);
}
function zzz(){
  const z=document.createElement('span'); z.className='zzz'; z.textContent=pick(['z','Z','zZ']);
  z.style.fontSize=rnd(24,40)+'px';
  const r=$('#bedbox').getBoundingClientRect(), ar=$('#sleep').getBoundingClientRect();
  z.style.left=(r.left-ar.left+r.width*rnd(.15,.35))+'px'; z.style.top=(r.top-ar.top+r.height*.05)+'px';

$('#goSleep').addEventListener('click',()=>{
  if(SL.on) return; audio(); sfx('tap');
  SL.on=true; SL.t0=performance.now(); SL.from=needs.sleep;
  $('#sPeng').hidden=true; $('#lyPeng').hidden=false; $('#blanket').hidden=false;
  $('#goSleep').hidden=true; $('#sRing').hidden=false; $('#sRing').style.setProperty('--v',0);
  $('#dim').classList.add('on');
  say('Спокойной ночи!');
  setTimeout(()=>{ if(SL.on) lullaby(); },1500);
  SL.zz=setInterval(zzz,900);

    const p=clamp((performance.now()-SL.t0)/(SLEEP_SECS*1000),0,1);

    needs.sleep=lerp(SL.from,100,p);

});

  $('#lyPeng').hidden=true; $('#blanket').hidden=true; $('#sPeng').hidden=false; $('#sRing').hidden=true;

// --- tub
function tubTools(){ setTools($('#tubTools'),[IC.soap,IC.shower,IC.towel],BT.step,tubTool); }
function tubStart(){
  bathView('tub'); BT.step=0; refreshPenguins();
  $('#tubWrap').querySelectorAll('.bubbleFx,.spark,#towel').forEach(n=>n.remove());
  const n=clamp(Math.round((100-needs.clean)/12),3,7);
  $('#dirtLayer').innerHTML=Array.from({length:n},()=>`<i class="dirt" data-h="0" style="left:${rnd(34,66).toFixed(1)}%;top:${rnd(10,46).toFixed(1)}%"></i>`).join('');
  tubTools(); say(`Купаемся! Потри ${CH().acc} пальчиком!`);

$('#tubWrap').addEventListener('pointerdown',e=>{ if(e.target.closest('#duck')) return; BT.rub=true; try{$('#tubWrap').setPointerCapture(e.pointerId)}catch(_){} tubRub(e); });
$('#tubWrap').addEventListener('pointermove',e=>{ if(BT.rub) tubRub(e); });
addEventListener('pointerup',()=>{BT.rub=false;});
function tubRub(e){
  if(BT.view!=='tub'||BT.step!==0) return;
  const now=performance.now(); if(now-BT.last<45) return; BT.last=now;
  const p=localXY($('#tubWrap'),e);
  const foam=$('#tubWrap').querySelectorAll('.bubbleFx.stay').length;
  fxBubble($('#tubWrap'),p.x+rnd(-10,10),p.y+rnd(-10,10),rnd(18,34),foam<45);
  if(Math.random()<.35) tone(rnd(500,900),.06,'sine',.06);
  const dirts=[...$('#dirtLayer').children].filter(d=>!d.classList.contains('gone'));
  dirts.forEach(d=>{
    const dx=parseFloat(d.style.left)/100*p.w-p.x, dy=parseFloat(d.style.top)/100*p.h-p.y;
    if(Math.hypot(dx,dy)<p.w*.12){ d.dataset.h=+d.dataset.h+1; if(+d.dataset.h>=3){ d.classList.add('gone'); sfx('pick'); } }
  });
  if(dirts.length && dirts.every(d=>d.classList.contains('gone'))){
    BT.step=1; tubTools(); say('Чисто! Теперь смываем пену. Нажми на душ!');
  }
}
function tubTool(i){
  if(i!==BT.step){ if(BT.step===0) say(`Сначала потри ${CH().acc}!`); return; }
  const wrap=$('#tubWrap');
  if(i===1){
    BT.step=-1; say('Шшш... Душ!');
    const iv=setInterval(()=>{ for(let k=0;k<4;k++){ const d=document.createElement('i'); d.className='drop'; d.style.left=rnd(15,85)+'%'; d.style.top=rnd(-4,10)+'%'; wrap.appendChild(d); setTimeout(()=>d.remove(),820);} tone(rnd(2500,4000),.05,'triangle',.02); },70);
    BT.timers.push(iv);
    const foam=[...wrap.querySelectorAll('.bubbleFx.stay')];
    foam.forEach((f,k)=>BT.timers.push(setTimeout(()=>{f.style.transition='opacity .4s';f.style.opacity=0;setTimeout(()=>f.remove(),400);},300+k*40)));
    BT.timers.push(setTimeout(()=>{ clearInterval(iv); BT.step=2; tubTools(); say('Вытираемся полотенцем!'); },2600));
  }
  if(i===2){
    BT.step=-1;
    const t=document.createElement('div'); t.id='towel'; wrap.appendChild(t);
    tween(1.3,p=>{ t.style.transform=`translateX(${lerp(-70,170,p)}%) rotate(${Math.sin(p*12)*6}deg)`; },()=>{
      t.remove(); needs.clean=100; saveNeeds();
      const r=wrap.getBoundingClientRect(); for(let k=0;k<7;k++) fxSpark(wrap,rnd(.3,.7)*r.width,rnd(.05,.5)*r.height);
      react($('#bPeng'),'happy',2000); sfx('win'); confetti(30); say(`Чистенький! Спасибо, ${NAME}!`);
      BT.step=3; tubTools();
    });
  }
}

const TEETH=[]; [75,166].forEach((y,row)=>[60,105,150,195,240].forEach(x=>TEETH.push({x,y})));
function mouthSVG(){
  return `<svg viewBox="0 0 300 240" aria-hidden="true"><path d="M20 60 Q150 -10 280 60 Q296 120 280 180 Q150 250 20 180 Q4 120 20 60Z" fill="#ff9f1c" stroke="${INK}" stroke-width="5"/><ellipse cx="150" cy="120" rx="114" ry="80" fill="#8b1e2d"/><ellipse cx="150" cy="182" rx="64" ry="26" fill="#ff8fa3"/>${TEETH.map((t,i)=>`<rect class="tooth" id="t${i}" x="${t.x-19}" y="${t.y-23}" width="38" height="46" rx="12" fill="#fff8e8" stroke="#d9cfb8" stroke-width="3"/>`).join('')}</svg>`;
}
function teethTools(){ setTools($('#teethTools'),[IC.paste,IC.brush,IC.cup],BT.step,teethTool); }
function teethStart(){
  bathView('teeth'); BT.step=0;
  const wrap=$('#mouthWrap'); wrap.querySelectorAll('svg,.bubbleFx,.spark').forEach(n=>{ if(!n.closest('#brush')&&!n.closest('#germs')) n.remove(); });
  wrap.insertAdjacentHTML('afterbegin',mouthSVG());
  const idx=TEETH.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,6);
  $('#germs').innerHTML=idx.map(i=>`<i class="germ" data-h="0" style="left:${(TEETH[i].x/300*100).toFixed(1)}%;top:${(TEETH[i].y/240*100).toFixed(1)}%">${germSVG}</i>`).join('');
  $('#brush').hidden=true; $('#brush').innerHTML=IC.brush.replace('viewBox="0 0 100 100"','viewBox="0 0 100 100" style="width:100%;height:auto"');
  teethTools(); say('Ой, микробы! Давай почистим зубки. Сначала паста!');
}
function teethTool(i){
  if(i!==BT.step){ if(BT.step===1) say('Три щёткой по зубкам!'); return; }
  if(i===0){ sfx('plop'); BT.step=1; teethTools(); say('Теперь три щёточкой!'); }
  if(i===2){
    const wrap=$('#mouthWrap'); BT.step=3; teethTools(); $('#brush').hidden=true;
    wrap.querySelectorAll('.bubbleFx').forEach(b=>b.remove());
    tone(300,.4,'sine',.1,0,600); tone(400,.4,'sine',.1,.3,800);
    setTimeout(()=>{
      const r=wrap.getBoundingClientRect(); TEETH.forEach(t=>fxSpark(wrap,t.x/300*r.width,t.y/240*r.height));
      sfx('ding'); confetti(30); bump('clean',20); say(`Зубки чистые! ${NAME}, ты молодец!`);
    },600);
  }
}
let brushing=false;
$('#mouthWrap').addEventListener('pointerdown',e=>{ if(BT.step!==1){ if(BT.step===0) say('Сначала паста!'); return; } brushing=true; try{$('#mouthWrap').setPointerCapture(e.pointerId)}catch(_){} brushMove(e); });
$('#mouthWrap').addEventListener('pointermove',e=>{ if(brushing) brushMove(e); });
$('#mouthWrap').addEventListener('pointerup',()=>{ brushing=false; });
function brushMove(e){
  if(BT.step!==1) return;
  const wrap=$('#mouthWrap'), p=localXY(wrap,e), br=$('#brush');
  br.hidden=false; br.style.left=p.x+'px'; br.style.top=p.y+'px';
  const now=performance.now(); if(now-BT.last<50) return; BT.last=now;
  if(wrap.querySelectorAll('.bubbleFx.stay').length<40) fxBubble(wrap,p.x+rnd(-12,12),p.y+rnd(-8,8),rnd(10,20),true);
  tone(rnd(180,260),.05,'sawtooth',.025);
  const germs=[...$('#germs').children].filter(g=>!g.classList.contains('gone'));
  germs.forEach(g=>{
    const dx=parseFloat(g.style.left)/100*p.w-p.x, dy=parseFloat(g.style.top)/100*p.h-p.y;
    if(Math.hypot(dx,dy)<p.w*.1){
      g.dataset.h=+g.dataset.h+1; g.classList.remove('hit'); void g.offsetWidth; g.classList.add('hit');
      if(+g.dataset.h>=4){ g.classList.add('gone'); tone(1200,.15,'sine',.12,0,2000); if(Math.random()<.4) say(pick(['Ой-ой!','Пока, микроб!','Убегаю!'])); }
    }
  });
  if(germs.length && germs.every(g=>g.classList.contains('gone'))){ BT.step=2; teethTools(); setTimeout(()=>say('Все микробы убежали! Полощем ротик!'),500); }
}

function docStart(){
  D.step=0; D.sickAtStart=!!needs.sick; applySick(); refreshPenguins();
  $('#thermoRead').hidden=true; $('#thermoRead').classList.remove('hot'); $('#boo').hidden=false; $('#plaster').hidden=true; $('#docAgain').hidden=true;
  docTools();
  setTimeout(()=>{ if(current==='doctor') say(needs.sick?`Апчхи! Доктор ${NAME}, я заболел! И крылышко болит.`:`Доктор ${NAME}, проверь меня! Крылышко болит.`); },300);
}
function docTool(i,btn){
  if(i!==D.step) return;
  D.step=-1;
  if(i===0){
    const tr=$('#thermoRead'), target=D.sickAtStart?38.4:36.6; tr.hidden=false;
    tween(1.6,p=>{ tr.textContent=(35+(target-35)*p).toFixed(1).replace('.',',')+'°'; if(Math.random()<.15) sfx('tick'); },()=>{
      tone(2000,.1,'square',.08); tone(2000,.1,'square',.08,.18);
      if(D.sickAtStart){ tr.classList.add('hot'); say('Ого, температура! Надо лечиться.'); } else say('Температура нормальная! Но давай полечим крылышко.');
      D.step=1; docTools();
    });

  if(i===1){

      D.step=4; docTools(); $('#docAgain').hidden=false;

  }

$('#icMem').innerHTML=`<svg viewBox="0 0 100 100"><rect x="14" y="22" width="40" height="54" rx="8" fill="#fff" transform="rotate(-10 34 49)"/><rect x="46" y="22" width="40" height="54" rx="8" fill="#ffd34d" transform="rotate(10 66 49)"/><path d="M66 38 L70 48 L80 49 L72 56 L75 66 L66 60 L57 66 L60 56 L52 49 L62 48Z" fill="#fff" transform="rotate(10 66 49)"/></svg>`;

function memStart(){
  lv.m=lv.m||1; lvlBadge($('#mLvl'),lv.m);
  const pairs=MEM_PAIRS[Math.min(lv.m,MEM_PAIRS.length)-1];
  const keys=Object.keys(MEM_ITEMS).sort(()=>Math.random()-.5).slice(0,pairs);
  const deck=[...keys,...keys].sort(()=>Math.random()-.5);
  Object.assign(M,{open:[],lock:false,done:0,pairs});
  $('#memNext').hidden=true;
  const g=$('#mgrid'); const cols=pairs===3?3:4, rows=Math.ceil(deck.length/cols);
  g.innerHTML=deck.map((k,i)=>`<button class="card" data-k="${k}" data-i="${i}" aria-label="Карточка"><div class="inn"><div class="f">${starSVG}</div><div class="b">${k==='penguin'?penguinSVG(look.jersey,look.hat,'','peng'):MEM_ITEMS[k][0]}</div></div></button>`).join('');
  requestAnimationFrame(()=>{
    const W=g.clientWidth, H=g.clientHeight||400, gap=10;
    const w=Math.floor(Math.min((W-gap*(cols-1))/cols,((H-gap*(rows-1))/rows)*.75,130));

  });

$('#mgrid').addEventListener('click',e=>{
  const c=e.target.closest('.card'); if(!c||M.lock||c.classList.contains('open')||c.classList.contains('done')) return;

  if(M.open.length<2) return;
  M.lock=true; const [a,b]=M.open; M.open=[];
  if(a.dataset.k===b.dataset.k){
    setTimeout(()=>{
      a.classList.add('done'); b.classList.add('done'); a.classList.remove('open'); b.classList.remove('open');
      sfx('pick'); M.done++; bump('play',4); M.lock=false;

});

/* ---------- STROKING (petting) ---------- */
const PET={on:false,h:null,dist:0,lx:0,ly:0,purr:null,said:0,last:0,since:0};
function purrStart(){
  const a=audio(); if(!a) return null;
  const o=a.createOscillator(); o.type='sawtooth'; o.frequency.value=70;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=380;
  const g=a.createGain(); g.gain.value=.05;
  const lfo=a.createOscillator(); lfo.frequency.value=24; const lg=a.createGain(); lg.gain.value=.05; lfo.connect(lg).connect(g.gain);
  const m=a.createGain(); m.gain.setValueAtTime(0,a.currentTime); m.gain.linearRampToValueAtTime(1,a.currentTime+.25);
  o.connect(f).connect(g).connect(m).connect(a.destination); o.start(); lfo.start();
  return {o,lfo,m};
}
function purrStop(p){ if(!p) return; const a=audio(); try{ p.m.gain.cancelScheduledValues(a.currentTime); p.m.gain.setValueAtTime(p.m.gain.value,a.currentTime); p.m.gain.linearRampToValueAtTime(0,a.currentTime+.2); p.o.stop(a.currentTime+.25); p.lfo.stop(a.currentTime+.25);}catch(e){} }
function heartAt(h,x,y){
  const sec=h.closest('.screen'); if(!sec) return; const r=sec.getBoundingClientRect();
  const s=document.createElement('span'); s.className='heart'; s.textContent='♥';
  s.style.left=(x-r.left-12+rnd(-14,14))+'px'; s.style.top=(y-r.top-30)+'px'; s.style.fontSize=rnd(22,38)+'px';
  sec.appendChild(s); setTimeout(()=>s.remove(),1700);
}
document.querySelectorAll('.tappable').forEach(h=>{
  h.addEventListener('pointerdown',e=>{ Object.assign(PET,{h,dist:0,lx:e.clientX,ly:e.clientY,on:false}); h._stroked=false; });
});
function petStart(){
  const h=PET.h; if(!h||songOn) return;
  PET.on=true; PET.since=performance.now(); h._stroked=true;
  clearTimeout(h._t); const svg=h.querySelector('svg'); if(svg) svg.setAttribute('class','peng pet');
  PET.purr=purrStart();
  if(performance.now()-PET.said>5000){ PET.said=performance.now(); say(pick(['Мур-мур!','Ой, как приятно!',`${NICK}, ещё погладь!`,'Мурр... я тебя люблю!'])); }
}
function petEnd(){
  if(PET.on){
    purrStop(PET.purr); PET.purr=null;
    const h=PET.h, svg=h&&h.querySelector('svg'); if(svg) svg.setAttribute('class','peng '+(h.dataset.peng||''));
    bump('play',Math.min(6,Math.round((performance.now()-PET.since)/700)));
  }
  PET.on=false; PET.h=null;
}
addEventListener('pointermove',e=>{
  if(!PET.h) return;
  const d=Math.hypot(e.clientX-PET.lx,e.clientY-PET.ly); PET.lx=e.clientX; PET.ly=e.clientY; PET.dist+=d;
  if(!PET.on && PET.dist>45) petStart();
  if(PET.on){ const now=performance.now(); if(now-PET.last>230 && d>1.5){ PET.last=now; heartAt(PET.h,e.clientX,e.clientY); } }
});
addEventListener('pointerup',petEnd); addEventListener('pointercancel',petEnd);

function lCfg(){ const v=lv.l||1; return {maxN:[3,4,5,5][v-1], choices:[3,4,5,7][v-1], voiceOnly:v>=3}; }
function learnStart(){ lv.l=lv.l||1; L.round=0; lvlBadge($('#lLvl'),lv.l); learnRound(); }
function learnSay(){
  if(L.type==='count') say(`Положи в корзину ${L.noun.f[L.n-1]}!`);
  else say(`Найди ${L.target[1]} мяч!`);
}
function learnRound(){
  clearTimeout(L.timer); L.busy=false; L.got=0;
  dots($('#lDots'),L.round,yStar);
  const c=lCfg(); L.type=(L.round%2===0)?'count':'color';
  const field=$('#lField'), basket=$('#basket');
  if(L.type==='count'){
    const keys=Object.keys(NOUNS); L.noun=NOUNS[pick(keys)]; L.n=Math.floor(rnd(1,c.maxN+1));
    const total=Math.min(L.n+Math.floor(rnd(2,4)),8);
    field.innerHTML=Array.from({length:total},()=>`<button class="litem" data-c="1" aria-label="Предмет">${L.noun.art()}</button>`).join('');
    basket.hidden=false; basket.innerHTML=basketSVG+`<span class="cnt">0</span>`;
    $('#lTask').innerHTML=`<b>${L.n}</b>${L.noun.art()}${spkSVG}`;
  } else {
    const cols=[...LCOL].sort(()=>Math.random()-.5).slice(0,c.choices);
    L.target=pick(cols);
    field.innerHTML=cols.map((col,i)=>`<button class="litem" data-col="${i}" aria-label="Мяч">${ballArt(col[0])}</button>`).join('');
    field._cols=cols; basket.hidden=true;
    $('#lTask').innerHTML=(c.voiceOnly?`<b>?</b>`:ballArt(L.target[0]))+spkSVG;
  }
  setTimeout(()=>{ if(current==='learn') learnSay(); },350);
}
$('#lTask').addEventListener('click',()=>{ audio(); learnSay(); });
$('#lField').addEventListener('click',e=>{
  const b=e.target.closest('.litem'); if(!b||L.busy||b.classList.contains('taken')) return; audio();
  if(L.type==='count'){
    if(L.got>=L.n){ say(`Уже хватит! Нужно ${L.n}.`); return; }
    b.classList.add('taken'); sfx('pick'); L.got++; const k=L.got;
    say(COUNT_WORDS[k-1]+'!');
    flyTo(L.noun.art(),b,()=>{ $('#basket .cnt').textContent=k; sfx('plop'); if(k===L.n) learnWin(`Правильно! ${L.noun.f[L.n-1]}!`); },'#basket');
    if(k===L.n) L.busy=true;
  } else {
    const col=$('#lField')._cols[+b.dataset.col];
    if(col===L.target){ L.busy=true; b.classList.add('yes'); learnWin(`Да! Это ${col[1]} мяч!`); }
    else { b.classList.remove('no'); void b.offsetWidth; b.classList.add('no'); tone(300,.15,'sine',.1,0,220); say(`Это ${col[1]}. Найди ${L.target[1]}!`); }
  }
});
function learnWin(phrase){
  sfx('goal'); confetti(20); bump('play',4);
  setTimeout(()=>say(`${phrase} ${pick(PRAISE)}`),250);
  L.round++; dots($('#lDots'),L.round,yStar);
  L.timer=setTimeout(()=>{
    if(current!=='learn') return;
    if(L.round>=5){
      L.round=0; if((lv.l||1)<4){ lv.l=(lv.l||1)+1; saveLv(); }
      lvlBadge($('#lLvl'),lv.l); sfx('win'); confetti(50); say(`Ура! ${NAME}, ты всё знаешь! Уровень ${LVLW[lv.l-1]}!`);
      L.timer=setTimeout(()=>{ if(current==='learn') learnRound(); },2600);
    } else learnRound();
  },2300);
}

const J={li:-1,x:0,y:0,off:0,busy:false,score:0,floes:[],W:0,H:0,pw:60,started:false};
function jCfg(){ const v=lv.j||1; return {lanes:[3,4,5,6,6][v-1], speed:[45,60,75,90,110][v-1], fw:[.46,.42,.38,.34,.3][v-1]}; }
function laneY(i){ const c=jCfg(); if(i<0) return J.H-J.bot/2; if(i>=c.lanes) return J.top-J.pw*.55; return J.H-J.bot-J.laneH*(i+.5); }
function jumpStart(){ lv.j=lv.j||1; J.score=0; J.started=false; jLayout(); setTimeout(()=>{ if(current==='jump') say(`${NAME}, прыгай по льдинкам к рыбкам! Нажимай, когда льдинка светится!`); },300); }
function jLayout(){
  const st=$('#jStage'), c=jCfg(); J.W=st.clientWidth; J.H=st.clientHeight;
  J.top=Math.max(J.H*.2,140); J.bot=Math.max(J.H*.14,90);
  J.laneH=(J.H-J.top-J.bot)/c.lanes; J.pw=Math.min(J.laneH*1.05,86); J.fw=J.W*c.fw; J.fh=Math.min(J.laneH*.6,60);
  let html=`<div class="bank" style="height:${J.top}px;top:0"></div><div class="bank" style="height:${J.bot}px;top:${J.H-J.bot}px"></div>`;
  for(let k=0;k<5;k++) html+=`<div class="goalfish" style="transform:translate(${J.W*(.1+k*.18)}px,${J.top-50}px)">${fishSVG}</div>`;
  J.floes=[];
  for(let i=0;i<c.lanes;i++){ html+=`<div class="floe" id="fl${i}" style="width:${J.fw}px;height:${J.fh}px"></div>`; }
  html+=`<div class="jpeng" id="jp" style="width:${J.pw}px">${penguinSVG(look.jersey,look.hat,'idle')}</div>`;
  st.innerHTML=html;
  for(let i=0;i<c.lanes;i++) J.floes.push({x:rnd(0,J.W-J.fw),dir:i%2?1:-1,sp:c.speed*rnd(.8,1.25),el:$('#fl'+i)});
  J.li=-1; J.x=J.W/2; J.y=laneY(-1); J.busy=false; J.s=1;
  $('#jDots').innerHTML=Array.from({length:3},(_,i)=>`<i class="${i<J.score?'on':''}">${fishSVG}</i>`).join('');
  lvlBadge($('#jLvl'),lv.j); jRender();
}
function jRender(){
  J.floes.forEach((f,i)=>{ f.el.style.transform=`translate(${f.x}px,${laneY(i)-J.fh/2}px)`; });
  const p=$('#jp'); if(p) p.style.transform=`translate(${J.x-J.pw/2}px,${J.y-J.pw*1.05}px) scale(${J.s})`;
  const nx=J.li+1;
  J.floes.forEach((f,i)=>f.el.style.boxShadow= (i===nx && !J.busy && J.x>f.x+J.pw*.15 && J.x<f.x+J.fw-J.pw*.15) ? '0 0 0 6px #ffd34d,0 6px 0 rgba(10,40,90,.35)' : '');
}
function jTick(dt){
  if(!J.floes.length) return;
  J.floes.forEach(f=>{ f.x+=f.dir*f.sp*dt; if(f.x<4){f.x=4;f.dir=1;} if(f.x>J.W-J.fw-4){f.x=J.W-J.fw-4;f.dir=-1;} });
  if(!J.busy && J.li>=0 && J.li<J.floes.length){ const f=J.floes[J.li]; J.x=f.x+J.off; }
  jRender();
}
function jSplash(x,y){ const st=$('#jStage'); for(let k=0;k<3;k++){ const r=document.createElement('i'); r.className='splash'; const s=30+k*22; Object.assign(r.style,{left:(x-s/2)+'px',top:(y-s/2)+'px',width:s+'px',height:s+'px',animationDelay:(k*.1)+'s'}); st.appendChild(r); setTimeout(()=>r.remove(),1000);} }
$('#jStage').addEventListener('pointerdown',e=>{
  if(J.busy) return; audio();
  const c=jCfg(), from=J.li, to=J.li+1, y0=J.y, y1=laneY(to), x=J.x;
  J.busy=true; tone(500,.18,'sine',.15,0,900);
  tween(.38,p=>{ J.y=lerp(y0,y1,p)-Math.sin(Math.PI*p)*30; J.s=1+.25*Math.sin(Math.PI*p); },()=>{
    J.s=1;
    if(to>=c.lanes){
      J.li=to; J.y=y1; J.score++; sfx('goal'); confetti(30); bump('food',6); bump('play',6);
      say(`Рыбка! ${pick(PRAISE)}`);
      $('#jDots').innerHTML=Array.from({length:3},(_,i)=>`<i class="${i<J.score?'on':''}">${fishSVG}</i>`).join('');
      setTimeout(()=>{
        if(current!=='jump') return;
        if(J.score>=3){ J.score=0; if((lv.j||1)<5){lv.j=(lv.j||1)+1; saveLv();} sfx('win'); say(`Ура! Уровень ${LVLW[lv.j-1]}!`); }
        jLayout();
      },1700);
      return;
    }
    const f=J.floes[to];
    if(x>f.x-J.pw*.25 && x<f.x+J.fw+J.pw*.25){
      J.li=to; J.off=clamp(x-f.x,J.pw*.2,J.fw-J.pw*.2); J.y=y1; J.busy=false; tone(300,.12,'triangle',.15,0,500);
    } else {
      jSplash(x,y1); sfx('plop'); tone(200,.4,'sine',.12,0,90); say(pick(['Плюх! Ещё разок!','Ой, вода холодная! Попробуй ещё!']));
      tween(.3,p=>{J.s=1-p;},()=>setTimeout(()=>{
        J.li=from; J.y=laneY(from);
        if(from>=0) J.off=J.fw/2; else J.x=J.W/2;
        tween(.25,p=>{J.s=p;},()=>{J.busy=false;});
      },400));
    }
  });
});

/* ---------- MUSIC ---------- */
let NB=null;
function noise(dur,freq,type='highpass',vol=.2){
  const a=audio(); if(!a) return;
  if(!NB){ NB=a.createBuffer(1,a.sampleRate,a.sampleRate); const d=NB.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const s=a.createBufferSource(); s.buffer=NB; const f=a.createBiquadFilter(); f.type=type; f.frequency.value=freq;
  const g=a.createGain(), t=a.currentTime; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f).connect(g).connect(a.destination); s.start(t); s.stop(t+dur+.05);
}
const RAINBOW=['#e2483d','#ff9f1c','#ffd34d','#2fa84f','#4fc3e8','#2f80ed','#9b51e0','#ff6fa8'];

const DRUMS=[
  {n:'cymbal',art:`<svg viewBox="0 0 100 70"><ellipse cx="50" cy="30" rx="46" ry="12" fill="#ffd34d" stroke="#c99a00" stroke-width="4"/><ellipse cx="50" cy="28" rx="8" ry="3" fill="#c99a00"/><rect x="47" y="34" width="6" height="34" fill="#8fa3b8"/></svg>`,play:()=>noise(1.3,5000,'highpass',.16)},
  {n:'tomHi',art:`<svg viewBox="0 0 100 80"><rect x="14" y="20" width="72" height="44" rx="6" fill="#2f80ed" stroke="${INK}" stroke-width="4"/><ellipse cx="50" cy="20" rx="36" ry="10" fill="#fff" stroke="${INK}" stroke-width="4"/></svg>`,play:()=>tone(280,.3,'sine',.45,0,160)},
  {n:'hat',art:`<svg viewBox="0 0 100 70"><ellipse cx="50" cy="26" rx="40" ry="9" fill="#ffe27a" stroke="#c99a00" stroke-width="4"/><ellipse cx="50" cy="36" rx="40" ry="9" fill="#ffd34d" stroke="#c99a00" stroke-width="4"/><rect x="47" y="42" width="6" height="26" fill="#8fa3b8"/></svg>`,play:()=>noise(.07,7000,'highpass',.22)},
  {n:'snare',art:`<svg viewBox="0 0 100 80"><rect x="10" y="28" width="80" height="36" rx="6" fill="#e2483d" stroke="${INK}" stroke-width="4"/><ellipse cx="50" cy="28" rx="40" ry="11" fill="#fff" stroke="${INK}" stroke-width="4"/><path d="M14 46 H86" stroke="#fff" stroke-width="4"/></svg>`,play:()=>{noise(.2,1500,'highpass',.35); tone(200,.1,'triangle',.2);}},
  {n:'kick',art:`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#9b51e0" stroke="${INK}" stroke-width="4"/><circle cx="50" cy="50" r="32" fill="#fff" stroke="${INK}" stroke-width="3"/><circle cx="50" cy="50" r="10" fill="#ffd34d"/></svg>`,play:()=>tone(150,.45,'sine',.6,0,40)},
  {n:'tomLo',art:`<svg viewBox="0 0 100 80"><rect x="10" y="22" width="80" height="50" rx="6" fill="#2fa84f" stroke="${INK}" stroke-width="4"/><ellipse cx="50" cy="22" rx="40" ry="11" fill="#fff" stroke="${INK}" stroke-width="4"/></svg>`,play:()=>tone(160,.45,'sine',.5,0,85)}
];
const INSTR={
  piano:{icon:`<svg viewBox="0 0 64 64"><rect x="6" y="14" width="52" height="38" rx="4" fill="#fff" stroke="${INK}" stroke-width="3"/><path d="M19 14 V52 M32 14 V52 M45 14 V52" stroke="${INK}" stroke-width="3"/><rect x="15" y="14" width="8" height="22" fill="${INK}"/><rect x="41" y="14" width="8" height="22" fill="${INK}"/></svg>`},
  xylo:{icon:`<svg viewBox="0 0 64 64">${RAINBOW.slice(0,5).map((c,i)=>`<rect x="${6+i*11}" y="${10+i*4}" width="9" height="${44-i*8}" rx="3" fill="${c}"/>`).join('')}</svg>`},
  drums:{icon:DRUMS[3].art}
};
let mInst='piano', danceT=null, notes=0;
function musicStart(){ refreshPenguins(); $('#mTabs').innerHTML=Object.keys(INSTR).map(k=>`<button class="tab ${k===mInst?'sel':''}" data-ins="${k}" aria-label="${k}">${INSTR[k].icon}</button>`).join(''); renderInst(); setTimeout(()=>{ if(current==='music') say(`${NAME}, сыграй мне песенку! Я буду танцевать!`); },300); }
function renderInst(){
  const el=$('#inst');
  if(mInst==='piano') el.innerHTML=SCALE.map((m,i)=>`<button class="key" data-n="${i}" style="background:${RAINBOW[i]}" aria-label="Нота"></button>`).join('');
  if(mInst==='xylo') el.innerHTML=SCALE.map((m,i)=>`<button class="bar" data-n="${i}" style="background:${RAINBOW[i]};height:${180-i*11}px" aria-label="Нота"></button>`).join('');
  if(mInst==='drums') el.innerHTML=`<div class="drums">${DRUMS.map((d,i)=>`<button class="drum" data-n="${i}" aria-label="Барабан">${d.art}</button>`).join('')}</div>`;
  el.style.alignItems=mInst==='xylo'?'center':'flex-end';
}
$('#mTabs').addEventListener('click',e=>{ const b=e.target.closest('[data-ins]'); if(!b) return; audio(); sfx('tap'); mInst=b.dataset.ins; musicStart(); });
function mPlay(b){
  const i=+b.dataset.n;
  if(mInst==='piano'){ const f=mid(SCALE[i]); tone(f,.9,'triangle',.22); tone(f*2,.5,'sine',.05); }
  if(mInst==='xylo'){ const f=mid(SCALE[i]+12); tone(f,1,'sine',.25); tone(f*4,.12,'sine',.06); }
  if(mInst==='drums') DRUMS[i].play();
  b.classList.add('hit'); setTimeout(()=>b.classList.remove('hit'),120);
  const svg=$('#mPeng svg'); if(svg) svg.setAttribute('class','peng dance');
  clearTimeout(danceT); danceT=setTimeout(()=>{ const s=$('#mPeng svg'); if(s) s.setAttribute('class','peng idle'); },900);
  if(++notes%12===0){ bump('play',3); if(Math.random()<.5) say(pick(['Как красиво!','Ещё!','Ты музыкант!',`${NICK}, супер!`])); }
}
$('#inst').addEventListener('pointerdown',e=>{
  const b=e.target.closest('[data-n]'); if(!b) return; audio();
  try{ b.releasePointerCapture(e.pointerId); }catch(_){}
  b._p=e.pointerId; mPlay(b);
});
$('#inst').addEventListener('pointerover',e=>{
  if(!e.buttons && e.pointerType==='mouse') return;
  if(e.pointerType==='mouse' && !(e.buttons&1)) return;
  const b=e.target.closest('[data-n]'); if(!b||mInst==='drums') return;
  const from=e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('[data-n]'); if(from===b) return;
  if(e.pointerType!=='mouse' && e.pressure===0) return;
  mPlay(b);
});

function schProp(kind){
  const p=$('#schProp'); p.innerHTML='';
  const svg=$('#schPeng svg');
  if(kind==='blocks'){
    if(svg) svg.setAttribute('class','peng happy');
    const cols=['#e2483d','#2f80ed','#ffd34d','#2fa84f','#9b51e0'];

  }

    p.innerHTML=`<svg viewBox="0 0 200 200"><ellipse cx="100" cy="150" rx="80" ry="24" fill="#2f80ed"/><path d="M24 130 Q100 210 176 130Z" fill="#7fd3ff" stroke="${INK}" stroke-width="4"/><ellipse cx="100" cy="130" rx="76" ry="16" fill="#fff6e0"/><circle cx="80" cy="128" r="6" fill="#ffd34d"/><path d="M150 60 L120 124" stroke="#c7d3df" stroke-width="8" stroke-linecap="round"/></svg>`;

function schTick(dt){
  if(SCH.done) return;
  SCH.t+=dt;
  $('#schRing').style.setProperty('--v',Math.round(clamp(SCH.t/SCHOOL_SECS,0,1)*100));
  if(SCH.phase==='walk'){
    const W=$('#school').clientWidth, p=clamp(SCH.t/4,0,1), w=$('#schWalker');
    w.style.transform=`translate(${lerp(-20,W*.55,p)}px,${-Math.abs(Math.sin(SCH.t*9))*10}px) scale(${1-p*.35})`;
    if(SCH.t>=4.2){ SCH.phase='in'; $('#schOut').hidden=true; $('#schIn').hidden=false; tone(800,.2,'sine',.12); tone(1000,.3,'sine',.12,.15); say('Привет, друзья! Привет, воспитатель!'); }
    return;
  }
  const next=SCH_ACTS[SCH.act+1];
  if(next && SCH.t>=next.at){ SCH.act++; schProp(next.prop); say(next.say); }
  if(SCH.phase==='in' && SCH.act>=3 && SCH.act<4 && Math.random()<dt*1.2){ zzzAt($('#schIn'),$('#schPeng')); }
  if(SCH.t>=SCHOOL_SECS){
    SCH.done=true; needs.awake=0; needs.sleep=100; needs.play=100; saveNeeds();
    sfx('win'); confetti(40);
    say(`Я вернулся из садика! ${NAME}, я так соскучился! Было очень весело!`);
    $('#schBack').hidden=false;
  }
}
function zzzAt(box,el){
  const z=document.createElement('span'); z.className='zzz'; z.textContent=pick(['z','Z','zZ']); z.style.fontSize=rnd(22,36)+'px';
  const r=el.getBoundingClientRect(), br=box.getBoundingClientRect();
  z.style.left=(r.left-br.left+r.width*rnd(.3,.7))+'px'; z.style.top=(r.top-br.top)+'px'; box.appendChild(z); setTimeout(()=>z.remove(),2500);
}

function strandPts(s){

  const L=s.lvl*15*s.w*(HR.style==='fluffy'?1.25:1);
  const dx=Math.cos(s.a), dy=Math.sin(s.a), px=-dy, py=dx;
  const curl=HR.style==='curly'?L*.55:HR.style==='fluffy'?L*.3:L*.08;
  const tx=rx+dx*L, ty=ry+dy*L;
  const c1x=rx+dx*L*.5+px*curl, c1y=ry+dy*L*.5+py*curl;
  return {rx,ry,tx,ty,c1x,c1y};
}
function drawHair(){

}
function hairPoint(e){

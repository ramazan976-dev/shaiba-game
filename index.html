}
function hairCut(e){
  if(HR.tool!=='scissors') return;
  const now=performance.now(); if(now-HR.last<60) return;
  const p=hairPoint(e), col=HAIR_COLS[HR.col][0];
  let hit=false;

        bit.setAttribute('d',`M${q.tx-6} ${q.ty} q6 -8 12 0`); bit.setAttribute('stroke',col); bit.setAttribute('stroke-width','8'); bit.setAttribute('fill','none'); bit.setAttribute('stroke-linecap','round');
        bit.setAttribute('class','fallbit'); bit.style.setProperty('--dx',rnd(-40,40)+'px'); bit.style.setProperty('--r',rnd(-200,200)+'deg');
        $('#hairG').appendChild(bit); setTimeout(()=>bit.remove(),1000);

}

const BW={pins:[],ball:null,rolling:false,frame:0,throwN:0,t:0,hits:0,before:0,sw:null};
const PIN_WORDS=['','одну кеглю','две кегли','три кегли','четыре кегли','пять кеглей','шесть кеглей','семь кеглей','восемь кеглей','девять кеглей','все кегли'];
function bwStart(){ BW.frame=0; BW.throwN=0; bwDots(); bwLayout(true); setTimeout(()=>{ if(current==='bowl') say(`Боулинг! ${NAME}, смахни шар вверх или нажми, куда катить!`); },300); }
const bowlStart=bwStart;
function bwDots(){ $('#bwDots').innerHTML=Array.from({length:5},(_,i)=>`<i class="${i<BW.frame?'on':''}">${pinSVG}</i>`).join(''); }
function bwLayout(resetPins){
  const st=$('#bwStage'); const W=st.clientWidth, H=st.clientHeight;
  const laneW=Math.min(W*.8,380), lx=(W-laneW)/2, top=Math.max(H*.16,124);
  Object.assign(BW,{W,H,laneW,lx,top});
  BW.pr=laneW*.05; BW.sp=BW.pr*3.1; BW.br=BW.pr*1.7;
  if(resetPins||!BW.pins.length){
    BW.pins=[]; const y0=top+BW.pr*3;
    for(let r=3;r>=0;r--){ for(let j=0;j<=r;j++){ BW.pins.push({x:W/2+(j-r/2)*BW.sp, y:y0+(3-r)*BW.sp*.9, vx:0,vy:0,down:false,gone:false,rot:0}); } }
  }
  BW.ball={x:W/2,y:H*.84,vx:0,vy:0}; BW.rolling=false;
  let html=`<div class="lane" style="left:${lx}px;top:${top-20}px;width:${laneW}px;height:${H-top+20}px"></div>`;
  BW.pins.forEach((p,i)=>html+=`<div class="pin" id="pin${i}" style="width:${BW.pr*2.2}px;height:${BW.pr*5.4}px"${p.gone?' hidden':''}>${pinSVG}</div>`);

function bwRender(){
  BW.pins.forEach((p,i)=>{ const el=$('#pin'+i); if(!el) return; el.hidden=p.gone; el.style.transform=`translate(${p.x-BW.pr*1.1}px,${p.y-BW.pr*4.6}px) rotate(${p.rot}deg)`; el.style.opacity=p.down?.55:1; });
  const b=$('#bwBall'); if(b) b.style.transform=`translate(${BW.ball.x-BW.br}px,${BW.ball.y-BW.br}px) rotate(${BW.ball.y*2}deg)`;
}
function bwThrow(tx){
  if(BW.rolling) return; audio();
  tx=clamp(tx,BW.lx+BW.br,BW.lx+BW.laneW-BW.br);
  const b=BW.ball, dy=b.y-BW.top, sp=Math.max(700,BW.H*1.1);
  b.vy=-sp; b.vx=(tx-b.x)/dy*sp; BW.rolling=true; BW.t=0; BW.before=BW.pins.filter(p=>p.down||p.gone).length;
  noise(1.2,180,'lowpass',.35);
}
$('#bwStage').addEventListener('pointerdown',e=>{ const r=$('#bwStage').getBoundingClientRect(); BW.sw={x:e.clientX-r.left,y:e.clientY-r.top,t:performance.now()}; });
$('#bwStage').addEventListener('pointerup',e=>{
  if(!BW.sw) return; const r=$('#bwStage').getBoundingClientRect(); const x=e.clientX-r.left, y=e.clientY-r.top, s=BW.sw; BW.sw=null;

function bwTick(dt){
  if(!BW.rolling) return;
  BW.t+=dt; const b=BW.ball;
  b.x+=b.vx*dt; b.y+=b.vy*dt;
  const pins=BW.pins.filter(p=>!p.gone);
  pins.forEach(p=>{
    if(!p.down && b.y>-60 && Math.hypot(p.x-b.x,p.y-b.y)<BW.br+BW.pr){
      const d=Math.hypot(p.x-b.x,p.y-b.y)||1; p.down=true; p.vx=(p.x-b.x)/d*300+b.vx*.2; p.vy=(p.y-b.y)/d*300+b.vy*.25; tone(rnd(700,1100),.08,'square',.08); noise(.08,2500,'highpass',.15);
    }
    if(p.down){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=Math.pow(.06,dt); p.vy*=Math.pow(.06,dt); p.rot+=p.vx*dt*.8; if(p.x<BW.lx+BW.pr){p.x=BW.lx+BW.pr;p.vx=Math.abs(p.vx)*.4;} if(p.x>BW.lx+BW.laneW-BW.pr){p.x=BW.lx+BW.laneW-BW.pr;p.vx=-Math.abs(p.vx)*.4;} if(p.y<BW.top+BW.pr){p.y=BW.top+BW.pr;p.vy=0;}
      pins.forEach(q=>{ if(!q.down && q!==p && Math.hypot(q.x-p.x,q.y-p.y)<BW.pr*2.3 && Math.hypot(p.vx,p.vy)>120){ const d=Math.hypot(q.x-p.x,q.y-p.y)||1; q.down=true; q.vx=(q.x-p.x)/d*Math.hypot(p.vx,p.vy)*.5; q.vy=(q.y-p.y)/d*Math.hypot(p.vx,p.vy)*.5-30; tone(rnd(700,1100),.07,'square',.07); } });
    }
  });

  if(BW.t>2.2){ BW.rolling=false; bwScore(); }
}
function bwScore(){
  const all=BW.pins.length, down=BW.pins.filter(p=>p.down||p.gone).length, now=down-BW.before;
  BW.throwN++;
  let msg;
  if(down===all && BW.throwN===1){ msg=`Страйк! Все кегли! ${pick(PRAISE)}`; sfx('win'); confetti(60); bump('play',8); }
  else if(down===all){ msg=`Все кегли! ${pick(PRAISE)}`; sfx('goal'); confetti(30); bump('play',5); }
  else if(now===0) msg=pick(MISS);
  else { msg=`Ты сбил ${PIN_WORDS[now]}! ${pick(PRAISE)}`; sfx('pick'); bump('play',2); }
  say(msg);

  setTimeout(()=>{
    if(current!=='bowl') return;
    if(frameDone){
      BW.frame++; BW.throwN=0; bwDots();
      if(BW.frame>=5){ BW.frame=0; sfx('win'); confetti(50); say(`Игра окончена! ${NAME}, ты чемпион по боулингу!`); setTimeout(bwDots,1500); }
      bwLayout(true);
    } else { BW.pins.forEach(p=>{ if(p.down){p.gone=true;} }); bwLayout(false); }
  },1800);
}

/* ---------- RACE ---------- */
const RC={lane:1,x:0,obs:[],dist:0,goal:0,speed:0,stars:0,crash:0,inv:0,done:false,spawn:0,dash:0,sw:null};
const PET_HEAD={peng:INK,hedge:'#7a4e2d',gir:'#f2c14e',tiger:'#ff9f1c',lion:'#e08a2a'};
function rcCfg(){ const v=lv.r||1; return {speed:[260,310,360,410,460][v-1], len:32, double:v>=3, gap:[1.25,1.1,1,.9,.8][v-1]}; }
function rcSize(){ const cv=$('#rcCv'), dpr=devicePixelRatio||1; RC.W=cv.clientWidth; RC.H=cv.clientHeight; cv.width=RC.W*dpr; cv.height=RC.H*dpr; RC.ctx=cv.getContext('2d'); RC.ctx.setTransform(dpr,0,0,dpr,0,0); RC.rw=Math.min(RC.W*.86,420); RC.rx=(RC.W-RC.rw)/2; RC.lw=RC.rw/3; }

function raceStart(){ lv.r=lv.r||1; rcSize(); const c=rcCfg(); Object.assign(RC,{lane:1,x:laneCX(1),obs:[],dist:0,goal:c.speed*c.len,speed:c.speed,stars:0,crash:0,inv:0,done:false,spawn:1}); rcHud(); lvlBadge($('#rcLvl'),lv.r); setTimeout(()=>{ if(current==='race') say(`Гонки! Нажимай слева или справа, чтобы объехать! Собирай звёздочки!`); },300); }
function rcHud(){ $('#rcScore').innerHTML=yStar+`<span>${RC.stars}</span>`; }
function rcMove(d){ if(RC.done) return; const n=clamp(RC.lane+d,0,2); if(n!==RC.lane){ RC.lane=n; tone(500,.08,'triangle',.08,0,700);} }
$('#rcCv').addEventListener('pointerdown',e=>{ audio(); RC.sw={x:e.clientX,t:performance.now()}; });
$('#rcCv').addEventListener('pointerup',e=>{ if(!RC.sw) return; const dx=e.clientX-RC.sw.x; RC.sw=null; if(RC.done){ raceStart(); return; } if(Math.abs(dx)>30) rcMove(Math.sign(dx)); else { const r=$('#rcCv').getBoundingClientRect(); rcMove(e.clientX-r.left<RC.x?-1:1); } });
addEventListener('keydown',e=>{ if(current==='race'){ if(e.key==='ArrowLeft') rcMove(-1); if(e.key==='ArrowRight') rcMove(1);} if(current==='skate' && (e.key===' '||e.key==='ArrowUp')){ e.preventDefault(); skJump(); } });
function rcTick(dt){
  if(!RC.ctx) return; const c=rcCfg(), carY=RC.H*.8, carH=Math.min(RC.lw*1.35,110), carW=carH*.6;
  if(!RC.done){
    const sp=RC.speed*(RC.crash>0?.45:1);
    RC.dist+=sp*dt; RC.dash=(RC.dash+sp*dt)%60; RC.crash=Math.max(0,RC.crash-dt); RC.inv=Math.max(0,RC.inv-dt);

      const lanes=[0,1,2].sort(()=>Math.random()-.5); const nObs=c.double&&Math.random()<.4?2:1;
      for(let k=0;k<nObs;k++) RC.obs.push({lane:lanes[k],y:-80,type:Math.random()<.5?'cone':'car',hue:pick(['#9b51e0','#2fa84f','#e2483d','#ff9f1c'])});

    }
    RC.obs.forEach(o=>o.y+=sp*dt*(o.type==='car'?.65:1));

        if(RC.inv<=0){ RC.crash=.8; RC.inv=1.6; noise(.3,800,'lowpass',.3); tone(300,.3,'sawtooth',.08,0,120); say(pick(['Бип-бип! Осторожно!','Ой! Объезжай!','Бум! Ничего, едем дальше!'])); }

  }

const SK={x:0,y:0,vy:0,air:false,jumps:0,wx:0,obs:[],fish:[],hills:[],next:0,cleared:0,fishN:0,hit:0,inv:0,clouds:[]};

function skHud(){ $('#skScore').innerHTML=fishSVG+`<span>${SK.fishN}</span>`; }
function groundAt(wx){ let y=SK.G; SK.hills.forEach(h=>{ if(wx>h.x&&wx<h.x+h.w) y-=h.h*Math.sin(Math.PI*(wx-h.x)/h.w); }); return y; }

function skTick(dt){

    else { const t=pick(['cone','box','puddle','cone','box']); const w=t==='puddle'?80:t==='box'?50:40; SK.obs.push({x:SK.next,t,w,h:t==='puddle'?10:t==='box'?48:44}); if(Math.random()<.6) SK.fish.push({x:SK.next+w/2,y:-190}); SK.next+=w+rnd(260,420); }

  });

  g.fillStyle='#fff'; SK.clouds.forEach(cl=>{ cl.x-=sp*dt*.15*cl.s; if(cl.x<-120) cl.x=W+60; g.beginPath(); g.arc(cl.x,cl.y,22*cl.s,0,7); g.arc(cl.x+26*cl.s,cl.y-10*cl.s,26*cl.s,0,7); g.arc(cl.x+54*cl.s,cl.y,20*cl.s,0,7); g.fill(); });
  g.fillStyle='#9ed98a'; g.beginPath(); g.moveTo(0,H); for(let x=0;x<=W;x+=40) g.lineTo(x,SK.G-60-Math.sin((x+SK.wx*.3)/120)*25); g.lineTo(W,H); g.fill();

    if(o.t==='cone'){ g.fillStyle='#ff7a1a'; g.beginPath(); g.moveTo(x+o.w/2,gy2-o.h); g.lineTo(x+o.w,gy2); g.lineTo(x,gy2); g.fill(); g.fillStyle='#fff'; g.fillRect(x+o.w*.25,gy2-o.h*.5,o.w*.5,6); }
    if(o.t==='box'){ g.fillStyle='#c88a5a'; g.fillRect(x,gy2-o.h,o.w,o.h); g.strokeStyle='#8a5a30'; g.lineWidth=3; g.strokeRect(x,gy2-o.h,o.w,o.h); g.beginPath(); g.moveTo(x,gy2-o.h); g.lineTo(x+o.w,gy2); g.moveTo(x+o.w,gy2-o.h); g.lineTo(x,gy2); g.stroke(); }
    if(o.t==='puddle'){ g.fillStyle='#4fa3e8'; g.beginPath(); g.ellipse(x+o.w/2,gy2-2,o.w/2,9,0,0,7); g.fill(); g.fillStyle='rgba(255,255,255,.6)'; g.beginPath(); g.ellipse(x+o.w*.35,gy2-4,10,3,0,0,7); g.fill(); }

  // player (DOM)
  const ang=Math.atan2(groundAt(pwx+10)-groundAt(pwx-10),20)*180/Math.PI;
  const spin=SK.hit>0?(1-SK.hit/.8)*360:0, blink=SK.inv>0&&Math.floor(SK.inv*10)%2;

  const b=e.target.closest('[data-l]'); if(!b||ABQ.busy) return; const i=+b.dataset.l;
  if(i===ABQ.target){ ABQ.busy=true; b.classList.add('yes'); sfx('goal'); confetti(20); bump('play',3); say(`Да! Это буква ${ABC[i][1]}! ${pick(PRAISE)}`); ABQ.round++;
    setTimeout(()=>{ if(current!=='abc') return; if(ABQ.round>=5){ ABQ.round=0; sfx('win'); confetti(50); say(`Ура! ${NAME}, ты знаешь буквы!`);} abcRender(); },2300); }
  else { b.classList.remove('no'); void b.offsetWidth; b.classList.add('no'); say(`Это буква ${ABC[i][1]}. Найди букву ${ABC[ABQ.target][1]}!`); }
});
